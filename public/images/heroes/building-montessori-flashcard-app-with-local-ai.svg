<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient (Signature Warm Cream) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <!-- Structural Slate Gradients -->
    <linearGradient id="slateTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="slateLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="slateRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Chromatic Energy Beams & Floating Planes -->
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardPlaneA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardPlaneB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="tensorMatrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="heroShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="300" r="260" fill="#BAE6FD" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="420" cy="400" r="220" fill="#FED7AA" opacity="0.35" filter="url(#softGlow)" />
  <circle cx="850" cy="220" r="180" fill="#DDD6FE" opacity="0.3" filter="url(#softGlow)" />

  <!-- Technical Blueprint Grid & Calipers -->
  <g opacity="0.4" stroke="#CBD5E1" stroke-width="1">
    <!-- Concentric Target Reticles -->
    <circle cx="600" cy="337" r="320" fill="none" stroke-dasharray="3,9" />
    <circle cx="600" cy="337" r="220" fill="none" stroke-dasharray="2,6" />
    <circle cx="600" cy="337" r="120" fill="none" stroke-dasharray="4,8" opacity="0.6" />

    <!-- Isometric Coordinate Axis -->
    <line x1="80" y1="40" x2="1120" y2="635" stroke-dasharray="4,8" />
    <line x1="80" y1="635" x2="1120" y2="40" stroke-dasharray="4,8" />
    <line x1="600" y1="40" x2="600" y2="635" stroke-dasharray="2,6" />
    <line x1="80" y1="337" x2="1120" y2="337" stroke-dasharray="2,6" />

    <!-- Precision Registration Crosshairs -->
    <g stroke="#94A3B8" stroke-width="1.5">
      <path d="M 160 120 L 180 120 M 170 110 L 170 130" />
      <path d="M 1040 120 L 1020 120 M 1030 110 L 1030 130" />
      <path d="M 160 555 L 180 555 M 170 545 L 170 565" />
      <path d="M 1040 555 L 1020 555 M 1030 545 L 1030 565" />
    </g>
  </g>

  <!-- ARCHITECTURAL COMPOSITION -->
  <g filter="url(#heroShadow)">

    <!-- Lower Foundation: Silicon Matrix / GPU Tensor Grid -->
    <g opacity="0.85">
      <!-- Base Rhombus Lattice -->
      <polygon points="600,480 840,360 600,240 360,360" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,6" />
      <polygon points="600,520 920,360 600,200 280,360" fill="url(#tensorMatrix)" stroke="#475569" stroke-width="1" />
      
      <!-- Sub-grid nodes -->
      <line x1="440" y1="320" x2="760" y2="480" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,4" />
      <line x1="520" y1="280" x2="840" y2="440" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,4" />
      <line x1="440" y1="400" x2="760" y2="240" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,4" />
      <line x1="520" y1="440" x2="840" y2="280" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2,4" />
    </g>

    <!-- STACKED ISOMETRIC FLASHCARD PLANES (Montessori 3-Part Triad) -->

    <!-- Card 1: Pronunciation / Acoustic Base Layer (Shifted Down-Right) -->
    <g transform="translate(60, 40)">
      <polygon points="560,400 780,290 560,180 340,290" fill="url(#cardPlaneB)" stroke="#93C5FD" stroke-width="2" />
      <!-- Waveform Glyph Simulation (Zero Text) -->
      <path d="M 440 290 Q 470 270 500 290 T 560 290 T 620 290 T 680 290" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Card 2: Concrete Object Plane (Central Primary Focus) -->
    <g transform="translate(0, 0)">
      <polygon points="560,360 780,250 560,140 340,250" fill="url(#cardPlaneA)" stroke="#CBD5E1" stroke-width="2.5" />
      <!-- Golden Inset Ratio Frame -->
      <polygon points="560,340 750,245 560,150 370,245" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6,4" />
      <!-- Central Geometric Motif (Sun / Archetype Symbol) -->
      <circle cx="560" cy="245" r="42" fill="url(#amberGrad)" stroke="#B45309" stroke-width="2" />
      <!-- Orbiting Rings -->
      <ellipse cx="560" cy="245" rx="68" ry="24" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3,5" />
    </g>

    <!-- Card 3: Word Nomenclature Plane (Elevated Top-Left) -->
    <g transform="translate(-60, -40)">
      <polygon points="560,320 780,210 560,100 340,210" fill="url(#cardPlaneB)" stroke="#38BDF8" stroke-width="2" />
      <!-- Clean Structural Bars (Simulating Linguistic Units without characters) -->
      <rect x="420" y="202" width="120" height="12" rx="6" fill="#0F172A" opacity="0.85" />
      <rect x="560" y="202" width="60" height="12" rx="6" fill="#0284C7" opacity="0.75" />
      <rect x="640" y="202" width="40" height="12" rx="6" fill="#F59E0B" opacity="0.9" />
    </g>

    <!-- CENTRAL MONOLITH: CORE ACCELERATOR & INFERENCE ENGINE -->
    <g transform="translate(680, 220)">
      <!-- Prismatic Structural Monolith -->
      <!-- Left Facet -->
      <polygon points="120,80 120,240 40,280 40,120" fill="url(#slateLeft)" stroke="#334155" stroke-width="1.5" />
      <!-- Right Facet -->
      <polygon points="120,80 200,120 200,280 120,240" fill="url(#slateRight)" stroke="#475569" stroke-width="1.5" />
      <!-- Top Cap (Electric Cobalt) -->
      <polygon points="120,80 200,120 120,160 40,120" fill="url(#cobaltGrad)" stroke="#60A5FA" stroke-width="2" />

      <!-- Glowing Core Vector Rings -->
      <circle cx="120" cy="200" r="28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,6" opacity="0.9" />
      <circle cx="120" cy="200" r="14" fill="#38BDF8" opacity="0.8" />
    </g>

    <!-- VERTICAL ENERGY CONDUITS & EDGE BEAMS -->
    <!-- Cloud Conduit Downflow -->
    <path d="M 680 80 L 680 200" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="6,6" stroke-linecap="round" />
    <circle cx="680" cy="80" r="6" fill="#38BDF8" />

    <!-- Lateral Synthesis Vector to TV/Edge Node -->
    <path d="M 780 250 L 960 340 L 960 440" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,6" />
    <!-- TV / Edge Display Node (Diamond Prism) -->
    <g transform="translate(960, 440)">
      <polygon points="0,-30 45,-5 0,20 -45,-5" fill="url(#slateTop)" stroke="#38BDF8" stroke-width="2" />
      <polygon points="-45,-5 0,20 0,60 -45,35" fill="url(#slateLeft)" />
      <polygon points="45,-5 0,20 0,60 45,35" fill="url(#slateRight)" />
      <circle cx="0" cy="-5" r="8" fill="#10B981" />
    </g>

    <!-- Left Local Controller Node (Daily Driver) -->
    <path d="M 340 250 L 220 310 L 220 420" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,6" />
    <g transform="translate(220, 420)">
      <polygon points="0,-30 45,-5 0,20 -45,-5" fill="url(#slateTop)" stroke="#F59E0B" stroke-width="2" />
      <polygon points="-45,-5 0,20 0,60 -45,35" fill="url(#slateLeft)" />
      <polygon points="45,-5 0,20 0,60 45,35" fill="url(#slateRight)" />
      <circle cx="0" cy="-5" r="8" fill="#F59E0B" />
    </g>

  </g>

  <!-- Technical Calibration Border Coordinates (Zero Text) -->
  <g stroke="#94A3B8" stroke-width="1" opacity="0.6">
    <line x1="40" y1="40" x2="60" y2="40" />
    <line x1="40" y1="40" x2="40" y2="60" />
    <line x1="1160" y1="40" x2="1140" y2="40" />
    <line x1="1160" y1="40" x2="1160" y2="60" />
    <line x1="40" y1="635" x2="60" y2="635" />
    <line x1="40" y1="635" x2="40" y2="615" />
    <line x1="1160" y1="635" x2="1140" y2="635" />
    <line x1="1160" y1="635" x2="1160" y2="615" />
  </g>
</svg>
