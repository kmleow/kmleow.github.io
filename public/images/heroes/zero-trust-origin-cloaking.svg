<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="originGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>

    <marker id="mtlsArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="dropArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1">
    <line x1="60" y1="50" x2="1140" y2="50" stroke-dasharray="4,8" />
    <line x1="60" y1="625" x2="1140" y2="625" stroke-dasharray="4,8" />
  </g>

  <!-- Title -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#0F172A" letter-spacing="-2">
      ZERO TRUST INGRESS
    </text>
  </g>

  <!-- 3 Macro-Step Flow (Zero microtext) -->
  <g transform="translate(60, 180)">
    
    <!-- Step 1: Public Internet / Attackers -->
    <g filter="url(#cardShadow)">
      <rect width="320" height="380" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <text x="160" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#64748B" text-anchor="middle">
        PUBLIC TRAFFIC
      </text>

      <!-- Direct Scan Attempt -->
      <g transform="translate(25, 120)">
        <rect width="270" height="80" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2" />
        <text x="135" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#DC2626" text-anchor="middle">
          DIRECT IP
        </text>
      </g>

      <!-- Authorized Ingress -->
      <g transform="translate(25, 240)">
        <rect width="270" height="80" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2" />
        <text x="135" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#2563EB" text-anchor="middle">
          EDGE PROXY
        </text>
      </g>
    </g>

    <!-- Conduits between Step 1 and 2 -->
    <!-- Direct IP Drop -->
    <path d="M 320 160 L 730 160" fill="none" stroke="#DC2626" stroke-width="5" stroke-dasharray="10,6" marker-end="url(#dropArrow)" />
    <rect x="470" y="132" width="140" height="44" rx="10" fill="#DC2626" />
    <text x="540" y="163" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">DROP</text>

    <!-- Authorized WAF Path -->
    <path d="M 320 280 L 400 280" fill="none" stroke="#2563EB" stroke-width="5" />

    <!-- Step 2: Cloudflare Edge / WAF -->
    <g transform="translate(400, 190)" filter="url(#cardShadow)">
      <rect width="280" height="180" rx="20" fill="url(#edgeGrad)" />
      <text x="140" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">
        WAF PROXY
      </text>
      <text x="140" y="130" font-family="ui-monospace, monospace" font-size="20" font-weight="800" fill="#FEF3C7" text-anchor="middle">
        ALLOWLIST
      </text>
    </g>

    <!-- Conduit to Origin: mTLS Tunnel -->
    <path d="M 680 280 L 760 280" fill="none" stroke="#059669" stroke-width="6" marker-end="url(#mtlsArrow)" />

    <!-- Step 3: Hardened Cloaked Origin Server -->
    <g transform="translate(760, 0)" filter="url(#cardShadow)">
      <rect width="320" height="380" rx="20" fill="url(#originGrad)" stroke="#059669" stroke-width="3" />
      <text x="160" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#F8FAFC" text-anchor="middle">
        CLOAKED
      </text>
      <text x="160" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#F8FAFC" text-anchor="middle">
        ORIGIN
      </text>
      
      <!-- mTLS Security Seal -->
      <g transform="translate(35, 180)">
        <rect width="250" height="120" rx="16" fill="#064E3B" stroke="#34D399" stroke-width="2" />
        <text x="125" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#34D399" text-anchor="middle">
          mTLS
        </text>
        <text x="125" y="95" font-family="ui-monospace, monospace" font-size="20" font-weight="800" fill="#A7F3D0" text-anchor="middle">
          VERIFIED
        </text>
      </g>
    </g>

  </g>
</svg>