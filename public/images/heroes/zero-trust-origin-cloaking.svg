<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradZt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="originCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="emeraldShield" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="ztShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>

    <filter id="softGlowZt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradZt)" />

  <!-- Ambient Light Fields -->
  <circle cx="600" cy="337" r="300" fill="#A7F3D0" opacity="0.25" filter="url(#softGlowZt)" />
  <circle cx="360" cy="240" r="180" fill="#FDE68A" opacity="0.3" filter="url(#softGlowZt)" />

  <!-- Radar Security Graticules & Ingress Boundary -->
  <g opacity="0.45" stroke="#CBD5E1" stroke-width="1">
    <circle cx="600" cy="337" r="320" fill="none" stroke-dasharray="3,6" />
    <circle cx="600" cy="337" r="220" fill="none" stroke-dasharray="4,8" />
    <circle cx="600" cy="337" r="130" fill="none" stroke-dasharray="2,6" />
    
    <line x1="120" y1="337" x2="1080" y2="337" stroke-dasharray="4,8" />
    <line x1="600" y1="60" x2="600" y2="615" stroke-dasharray="4,8" />

    <!-- 45-degree Perimeter Quadrants -->
    <line x1="240" y1="110" x2="960" y2="564" stroke-dasharray="2,8" opacity="0.5" />
    <line x1="240" y1="564" x2="960" y2="110" stroke-dasharray="2,8" opacity="0.5" />
  </g>

  <!-- SHIELDING & ORIGIN CLOAKING MOTIF -->
  <g filter="url(#ztShadow)">

    <!-- DEFLECTED PERIMETER THREAT VECTORS (LEFT INGRESS) -->
    <!-- Incoming probe rays bouncing off outer boundary -->
    <path d="M 100 240 L 320 280 L 160 160" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
    <path d="M 80 337 L 280 337 L 140 420" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <path d="M 120 440 L 340 390 L 200 520" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
    <circle cx="320" cy="280" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="280" cy="337" r="7" fill="#DC2626" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="340" cy="390" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />

    <!-- OUTER LAYER: EDGE WAF & PROXY PERIMETER (Concentric Amber Shield) -->
    <path d="M 600 130 C 740 130 840 210 840 337 C 840 464 740 544 600 544 C 460 544 360 464 360 337 C 360 210 460 130 600 130 Z" fill="url(#shieldGrad)" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8,6" />

    <!-- SECOND LAYER: TRANSPORT mTLS AUTHENTICATION RING (Emerald Interlocking Arc) -->
    <circle cx="600" cy="337" r="170" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="24,12" stroke-linecap="round" />
    <circle cx="600" cy="337" r="150" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="6,8" opacity="0.7" />

    <!-- CENTER: HARDENED, CLOAKED ORIGIN NUCLEUS (Isometric Diamond Prism) -->
    <!-- Center (600, 337) -->
    <g transform="translate(600, 337)">
      <!-- Top Facet (Royal Cobalt) -->
      <polygon points="0,-130 110,-55 0,20 -110,-55" fill="#2563EB" stroke="#60A5FA" stroke-width="2" />

      <!-- Left Facet (Midnight Slate Core) -->
      <polygon points="-110,-55 0,20 0,145 -110,70" fill="url(#originCoreGrad)" stroke="#334155" stroke-width="2" />

      <!-- Right Facet (Hardened Emerald Guard) -->
      <polygon points="0,20 110,-55 110,70 0,145" fill="url(#emeraldShield)" stroke="#34D399" stroke-width="2" />

      <!-- Inner Translucent Shield Facet -->
      <polygon points="0,-70 55,-30 0,10 -55,-30" fill="#FFFFFF" opacity="0.4" />
      <polygon points="0,10 55,-30 55,40 0,80" fill="#FFFFFF" opacity="0.2" />

      <!-- Origin Security Seal -->
      <circle cx="0" cy="0" r="9" fill="#FFFFFF" stroke="#059669" stroke-width="3.5" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#A7F3D0" stroke-width="2" stroke-dasharray="4,4" />
    </g>

    <!-- Radiating Ingress Verification Nodes (Allowlisted CIDRs) -->
    <g transform="translate(600, 337)">
      <circle cx="170" cy="0" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="-170" cy="0" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="0" cy="170" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="0" cy="-170" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
    </g>

    <!-- Corner Framing Reticles -->
    <g stroke="#0F172A" stroke-width="2.5" fill="none">
      <path d="M 140 100 L 120 100 L 120 120" />
      <path d="M 1060 100 L 1080 100 L 1080 120" />
      <path d="M 140 575 L 120 575 L 120 555" />
      <path d="M 1060 575 L 1080 575 L 1080 555" />
    </g>
  </g>
</svg>
