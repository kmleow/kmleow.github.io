<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <linearGradient id="cardRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF2F2" />
    </linearGradient>

    <linearGradient id="cardGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>

    <linearGradient id="redArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="greenArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02" />
    </linearGradient>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1">
    <line x1="60" y1="50" x2="1140" y2="50" stroke-dasharray="4,8" />
    <line x1="60" y1="625" x2="1140" y2="625" stroke-dasharray="4,8" />
  </g>

  <!-- Title -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#0F172A" letter-spacing="-2">
      FLOW OFFLOADING BENCHMARK
    </text>
  </g>

  <!-- Left: Before (300 Mbps Plateau) -->
  <g transform="translate(60, 150)" filter="url(#panelShadow)">
    <rect width="520" height="460" rx="20" fill="url(#cardRedGrad)" stroke="#FCA5A5" stroke-width="2.5" />
    <text x="40" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#DC2626" letter-spacing="-3">
      300 Mbps
    </text>
    <g transform="translate(40, 160)">
      <rect width="440" height="250" rx="14" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5" />
      <line x1="0" y1="150" x2="440" y2="150" stroke="#FEE2E2" stroke-width="1.5" stroke-dasharray="4,4" />
      <!-- Capped Plateau Curve -->
      <path d="M 0 200 L 60 200 L 100 150 L 440 150 L 440 240 L 0 240 Z" fill="url(#redArea)" />
      <path d="M 0 200 L 60 200 L 100 150 L 440 150" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="220" cy="150" r="6" fill="#DC2626" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="360" cy="150" r="6" fill="#DC2626" stroke="#FFFFFF" stroke-width="2" />
    </g>
  </g>

  <!-- Right: After (719 Mbps Line Rate) -->
  <g transform="translate(620, 150)" filter="url(#panelShadow)">
    <rect width="520" height="460" rx="20" fill="url(#cardGreenGrad)" stroke="#86EFAC" stroke-width="2.5" />
    <text x="40" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#059669" letter-spacing="-3">
      719 Mbps
    </text>
    <g transform="translate(40, 160)">
      <rect width="440" height="250" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5" />
      <line x1="0" y1="50" x2="440" y2="50" stroke="#F0FDF4" stroke-width="1.5" stroke-dasharray="4,4" />
      <!-- High Throughput Curve -->
      <path d="M 0 200 L 60 200 L 110 50 L 440 50 L 440 240 L 0 240 Z" fill="url(#greenArea)" />
      <path d="M 0 200 L 60 200 L 110 50 L 440 50" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="220" cy="50" r="6" fill="#059669" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="360" cy="50" r="6" fill="#059669" stroke="#FFFFFF" stroke-width="2" />
    </g>
  </g>
</svg>