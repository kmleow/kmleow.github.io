<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-cream-fo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-cream-fo)" />
  
  <!-- Header Text -->
  <g transform="translate(80, 50)">
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0f172a">Linux Kernel Fastpath: Flow Offloading</text>
    <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" fill="#64748b">Netfilter Stack Overhead vs. Cached 5-Tuple Packet Forwarding</text>
  </g>
  
  <!-- Comparison Cards -->
  <g transform="translate(80, 160)">
    <!-- Standard Netfilter Path -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="500" height="450" rx="20" fill="#ffffff" stroke="#fca5a5" stroke-width="2.5" filter="url(#cardShadow)" />
      
      <!-- Card Title -->
      <circle cx="40" cy="46" r="10" fill="#ef4444" />
      <text x="62" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#991b1b">Standard Netfilter Forwarding</text>
      <text x="40" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#64748b">Full IP stack evaluation per packet</text>
      
      <!-- Throughput Metric Bar -->
      <rect x="40" y="115" width="420" height="54" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
      <text x="60" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#b91c1c">~280 Mbps (100% CPU Saturated)</text>
      
      <!-- Bullet Points -->
      <g transform="translate(40, 215)">
        <circle cx="8" cy="8" r="5" fill="#ef4444" />
        <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Full conntrack &amp; iptables rules</text>
      </g>
      <g transform="translate(40, 275)">
        <circle cx="8" cy="8" r="5" fill="#ef4444" />
        <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Software interrupt bottleneck</text>
      </g>
      <g transform="translate(40, 335)">
        <circle cx="8" cy="8" r="5" fill="#ef4444" />
        <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Single-core CPU exhaustion</text>
      </g>

      <!-- Bottom Outcome Pill -->
      <rect x="40" y="380" width="420" height="42" rx="10" fill="#fee2e2" />
      <text x="250" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#991b1b">Bottleneck: Severe CPU Throttling</text>
    </g>
    
    <!-- Flow Offload Fastpath -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="500" height="450" rx="20" fill="#ffffff" stroke="#86efac" stroke-width="2.5" filter="url(#cardShadow)" />
      
      <!-- Card Title -->
      <circle cx="40" cy="46" r="10" fill="#10b981" />
      <text x="62" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#065f46">Flow Offload Fastpath</text>
      <text x="40" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#64748b">Cached 5-tuple bypass for flows</text>
      
      <!-- Throughput Metric Bar -->
      <rect x="40" y="115" width="420" height="54" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <text x="60" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#047857">940+ Mbps Line-Rate (&lt;15% CPU)</text>
      
      <!-- Bullet Points -->
      <g transform="translate(40, 215)">
        <circle cx="8" cy="8" r="5" fill="#10b981" />
        <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Bypasses iptables traversal</text>
      </g>
      <g transform="translate(40, 275)">
        <circle cx="8" cy="8" r="5" fill="#10b981" />
        <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Direct driver ring forwarding</text>
      </g>
      <g transform="translate(40, 335)">
        <circle cx="8" cy="8" r="5" fill="#10b981" />
        <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Zero CPU overhead on gigabit</text>
      </g>

      <!-- Bottom Outcome Pill -->
      <rect x="40" y="380" width="420" height="42" rx="10" fill="#d1fae5" />
      <text x="250" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#065f46">Outcome: Gigabit Routing at Low CPU</text>
    </g>
  </g>
</svg>
