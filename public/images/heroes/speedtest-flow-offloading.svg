<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradFo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <linearGradient id="fastpathBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="prismFo1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="prismFo2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <filter id="foShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <filter id="softGlowFo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradFo)" />

  <!-- Ambient Light Field -->
  <circle cx="700" cy="337" r="280" fill="#6EE7B7" opacity="0.2" filter="url(#softGlowFo)" />
  <circle cx="400" cy="280" r="200" fill="#93C5FD" opacity="0.25" filter="url(#softGlowFo)" />

  <!-- High-Speed Drafting Geometry & Grids -->
  <g opacity="0.45" stroke="#CBD5E1" stroke-width="1">
    <!-- Diagonal Velocity Guides (30-degree Fastpath Planes) -->
    <line x1="80" y1="520" x2="1120" y2="155" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,6" />
    <line x1="160" y1="580" x2="1120" y2="265" stroke-dasharray="4,8" />
    <line x1="80" y1="410" x2="980" y2="115" stroke-dasharray="4,8" />

    <!-- Concentric Acceleration Circles -->
    <circle cx="620" cy="337" r="260" fill="none" stroke-dasharray="3,6" />
    <circle cx="620" cy="337" r="390" fill="none" stroke-dasharray="2,8" opacity="0.6" />

    <!-- Vertical Timing Gates -->
    <line x1="380" y1="80" x2="380" y2="595" stroke-dasharray="3,6" opacity="0.5" />
    <line x1="620" y1="80" x2="620" y2="595" stroke-dasharray="3,6" opacity="0.5" />
    <line x1="860" y1="80" x2="860" y2="595" stroke-dasharray="3,6" opacity="0.5" />
  </g>

  <!-- FASTPATH COMPOSITION MOTIF -->
  <g filter="url(#foShadow)">

    <!-- Dense Slowpath Kernel Lattices (Traversed Only Once) -->
    <g transform="translate(260, 260) scale(0.85)" opacity="0.4">
      <rect x="0" y="0" width="140" height="140" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
      <line x1="0" y1="46" x2="140" y2="46" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="0" y1="92" x2="140" y2="92" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="46" y1="0" x2="46" y2="140" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="92" y1="0" x2="92" y2="140" stroke="#CBD5E1" stroke-width="1.5" />
    </g>

    <!-- HIGH-VELOCITY LINE-RATE FASTPATH BEAM (BYPASSING OVERHEAD) -->
    <!-- Broad Energy Channel -->
    <polygon points="120,490 1100,165 1100,210 120,535" fill="url(#fastpathBeam)" />

    <!-- Parallel High-Speed Vector Traces -->
    <line x1="100" y1="495" x2="1120" y2="160" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
    <line x1="140" y1="515" x2="1120" y2="188" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />
    <line x1="80" y1="475" x2="1080" y2="132" stroke="#34D399" stroke-width="2" stroke-dasharray="12,8" stroke-linecap="round" />

    <!-- FASTPATH ACCELERATION NUCLEUS (Isometric Prisms) -->
    <!-- Main Center Core (620, 310) -->
    <g transform="translate(620, 310)">
      <!-- Base Shadow Facet -->
      <polygon points="0,-120 140,-40 0,40 -140,-40" fill="#3B82F6" stroke="#93C5FD" stroke-width="2" opacity="0.9" />
      <polygon points="-140,-40 0,40 0,160 -140,80" fill="url(#prismFo1)" stroke="#334155" stroke-width="2" />
      <polygon points="0,40 140,-40 140,80 0,160" fill="url(#prismFo2)" stroke="#60A5FA" stroke-width="2" />

      <!-- Inner Speed Chevron Cutout -->
      <polygon points="0,-70 70,-30 0,10 -70,-30" fill="#FFFFFF" opacity="0.4" />
      <polygon points="0,10 70,-30 70,40 0,80" fill="#38BDF8" opacity="0.3" />

      <!-- High-Energy Packet Injector Node -->
      <circle cx="0" cy="0" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="3.5" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="5,5" />
    </g>

    <!-- Velocity Chevrons Along Fastpath Axis -->
    <path d="M 440 380 L 470 370 L 440 360" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 800 255 L 830 245 L 800 235" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 940 205 L 970 195 L 940 185" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- High-Rate Quantized Nodes -->
    <circle cx="360" cy="405" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="880" cy="230" r="8" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="1040" cy="180" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />

    <!-- Corner Framing Reticles -->
    <g stroke="#0F172A" stroke-width="2.5" fill="none">
      <path d="M 140 100 L 120 100 L 120 120" />
      <path d="M 1060 100 L 1080 100 L 1080 120" />
      <path d="M 140 575 L 120 575 L 120 555" />
      <path d="M 1060 575 L 1080 575 L 1080 555" />
    </g>
  </g>
</svg>
