<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-cream-fo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-cream-fo)" />
  <g opacity="0.04">
    <pattern id="grid-fo" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid-fo)" />
  </g>
  
  <!-- Header Text -->
  <text x="100" y="145" font-family="system-ui, sans-serif" font-weight="800" font-size="42" fill="#0f172a">Linux Kernel Fastpath: Flow Offloading</text>
  <text x="100" y="195" font-family="system-ui, sans-serif" font-weight="600" font-size="22" fill="#64748b">Netfilter Kernel Stack vs. Fastpath Packet Forwarding</text>
  
  <!-- Diagram Comparison -->
  <g transform="translate(100, 260)">
    <!-- Standard Netfilter Path -->
    <rect x="0" y="0" width="475" height="320" rx="16" fill="#ffffff" stroke="#fca5a5" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.03))" />
    <rect x="25" y="25" width="12" height="12" rx="6" fill="#ef4444" />
    <text x="48" y="37" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#991b1b">Standard Netfilter Forwarding</text>
    <text x="25" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Full IP stack evaluation per packet</text>
    
    <!-- Throughput Bar -->
    <rect x="25" y="98" width="425" height="36" rx="8" fill="#f1f5f9" />
    <rect x="25" y="98" width="160" height="36" rx="8" fill="#ef4444" />
    <text x="40" y="122" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff">~280 Mbps (CPU Saturated)</text>
    
    <text x="25" y="175" font-family="system-ui, sans-serif" font-size="14" fill="#334155">• Every packet traverses conntrack, iptables, &amp; routing</text>
    <text x="25" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#334155">• Single MIPS/ARM core hits 100% CPU utilization</text>
    <text x="25" y="245" font-family="system-ui, sans-serif" font-size="14" fill="#334155">• Severe software bottleneck on &gt;300 Mbps WAN tiers</text>
    <text x="25" y="280" font-family="system-ui, sans-serif" font-size="14" fill="#dc2626" font-weight="600">Bottleneck: Software interrupt CPU exhaustion</text>
    
    <!-- Flow Offload Fastpath -->
    <rect x="525" y="0" width="475" height="320" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.03))" />
    <rect x="550" y="25" width="12" height="12" rx="6" fill="#10b981" />
    <text x="573" y="37" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#065f46">Flow Offloading Fastpath</text>
    <text x="550" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Cached 5-tuple bypass for established flows</text>
    
    <!-- Throughput Bar -->
    <rect x="550" y="98" width="425" height="36" rx="8" fill="#f1f5f9" />
    <rect x="550" y="98" width="400" height="36" rx="8" fill="#10b981" />
    <text x="570" y="122" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff">780+ Mbps Line-Rate (&lt;15% CPU)</text>
    
    <text x="550" y="175" font-family="system-ui, sans-serif" font-size="14" fill="#334155">• Ingress packet matches cached bidirectional flow table</text>
    <text x="550" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#334155">• Bypasses iptables traversal and conntrack lookups</text>
    <text x="550" y="245" font-family="system-ui, sans-serif" font-size="14" fill="#334155">• Dispatches directly from driver ingress to egress ring</text>
    <text x="550" y="280" font-family="system-ui, sans-serif" font-size="14" fill="#059669" font-weight="600">Outcome: Line-rate gigabit routing on modest hardware</text>
  </g>
</svg>