<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1">
    <line x1="60" y1="50" x2="1140" y2="50" stroke-dasharray="4,8" />
    <line x1="60" y1="625" x2="1140" y2="625" stroke-dasharray="4,8" />
  </g>

  <!-- Title -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#0F172A" letter-spacing="-2">
      EXPRESSIVE LINQ CRAFTSMANSHIP
    </text>
  </g>

  <!-- Side-by-Side Code Diff -->
  <g transform="translate(60, 150)">
    
    <!-- Left: Dense Spaghetti (Before) -->
    <g filter="url(#cardShadow)">
      <rect width="520" height="460" rx="20" fill="#0F172A" stroke="#EF4444" stroke-width="2.5" />
      
      <!-- Label -->
      <rect x="30" y="30" width="170" height="44" rx="10" fill="#7F1D1D" />
      <text x="115" y="62" font-family="ui-monospace, monospace" font-size="22" font-weight="900" fill="#FCA5A5" text-anchor="middle">
        MONOLITHIC
      </text>

      <!-- Real Code from post -->
      <g transform="translate(30, 120)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600" fill="#94A3B8">
        <text x="0" y="40" fill="#CBD5E1">classes</text>
        <text x="20" y="80" fill="#60A5FA">.SelectMany<tspan fill="#94A3B8">(c => c.Students)</tspan></text>
        <text x="20" y="120" fill="#F87171">.Where<tspan fill="#FCA5A5">(s => s.Score >= 85</tspan></text>
        <text x="60" y="160" fill="#FCA5A5">&amp;&amp; s.Age >= 18</text>
        <text x="60" y="200" fill="#FCA5A5">&amp;&amp; !s.IsSuspended)</text>
        <text x="20" y="240" fill="#60A5FA">.OrderBy<tspan fill="#94A3B8">(s => s.Score)</tspan></text>
      </g>
    </g>

    <!-- Right: Clean Composable Pipeline (After) -->
    <g transform="translate(560, 0)" filter="url(#cardShadow)">
      <rect width="520" height="460" rx="20" fill="#0F172A" stroke="#10B981" stroke-width="2.5" />
      
      <!-- Label -->
      <rect x="30" y="30" width="180" height="44" rx="10" fill="#064E3B" />
      <text x="120" y="62" font-family="ui-monospace, monospace" font-size="22" font-weight="900" fill="#6EE7B7" text-anchor="middle">
        COMPOSABLE
      </text>

      <!-- Real Code from post -->
      <g transform="translate(30, 120)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600" fill="#94A3B8">
        <text x="0" y="40" fill="#CBD5E1">classes</text>
        <text x="20" y="80" fill="#60A5FA">.SelectMany<tspan fill="#94A3B8">(c => c.Students)</tspan></text>
        <text x="20" y="120" fill="#34D399">.Where<tspan fill="#6EE7B7">(HasHonorScore)</tspan></text>
        <text x="20" y="160" fill="#34D399">.Where<tspan fill="#6EE7B7">(IsLegalAdult)</tspan></text>
        <text x="20" y="200" fill="#34D399">.Where<tspan fill="#6EE7B7">(IsActive)</tspan></text>
        <text x="20" y="240" fill="#60A5FA">.OrderBy<tspan fill="#94A3B8">(s => s.Score)</tspan></text>
      </g>
    </g>

  </g>
</svg>