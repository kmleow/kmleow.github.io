<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-cream5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-cream5)" />
  
  <!-- Header Text -->
  <g transform="translate(80, 50)">
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0f172a">Expressive Code Craftsmanship: LINQ</text>
    <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" fill="#0284c7">Cognitive Load Reduction &amp; Composable Functional Pipelines</text>
  </g>
  
  <g transform="translate(80, 160)">
    <!-- Bad Code Card -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="500" height="450" rx="20" fill="#ffffff" stroke="#fca5a5" stroke-width="2.5" filter="url(#cardShadow)" />
      
      <!-- Card Title -->
      <circle cx="40" cy="46" r="10" fill="#ef4444" />
      <text x="62" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#991b1b">❌ Tangled Lambdas</text>
      <text x="40" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#64748b">High mental fatigue &amp; poor testability</text>
      
      <!-- Code Box -->
      <rect x="30" y="115" width="440" height="235" rx="14" fill="#0f172a" />
      <text x="50" y="158" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#f87171">items.Where(x =&gt;</text>
      <text x="50" y="195" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#cbd5e1">   (x.Age &gt; 18 &amp;&amp; x.Active)</text>
      <text x="50" y="232" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#cbd5e1">   &amp;&amp; x.Score &gt;= 90)</text>
      <text x="50" y="269" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#f87171">.OrderBy(x =&gt; x.Score)</text>
      <text x="50" y="306" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#94a3b8">.Select(x =&gt; x.Name);</text>

      <!-- Bottom Pill -->
      <rect x="30" y="375" width="440" height="45" rx="10" fill="#fee2e2" />
      <text x="250" y="404" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#991b1b">High Cognitive Friction</text>
    </g>
    
    <!-- Clean Code Card -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="500" height="450" rx="20" fill="#ffffff" stroke="#86efac" stroke-width="2.5" filter="url(#cardShadow)" />
      
      <!-- Card Title -->
      <circle cx="40" cy="46" r="10" fill="#10b981" />
      <text x="62" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#065f46">✓ Composable Pipeline</text>
      <text x="40" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#64748b">Self-documenting domain intent</text>
      
      <!-- Code Box -->
      <rect x="30" y="115" width="440" height="235" rx="14" fill="#0f172a" />
      <text x="50" y="158" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#38bdf8">students</text>
      <text x="50" y="195" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#34d399">   .Where(IsEligible)</text>
      <text x="50" y="232" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#34d399">   .Where(HasHonorGrade)</text>
      <text x="50" y="269" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#38bdf8">   .OrderBy(ByRankScore)</text>
      <text x="50" y="306" font-family="ui-monospace, monospace" font-size="19" font-weight="600" fill="#94a3b8">   .Select(Anonymize);</text>

      <!-- Bottom Pill -->
      <rect x="30" y="375" width="440" height="45" rx="10" fill="#d1fae5" />
      <text x="250" y="404" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#065f46">Readable &amp; Unit-Testable</text>
    </g>
  </g>
</svg>
