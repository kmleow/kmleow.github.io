<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradLinq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <linearGradient id="tangledGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cleanBlockGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="linqShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <filter id="softGlowLinq" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradLinq)" />

  <!-- Ambient Light Blooms -->
  <circle cx="340" cy="337" r="200" fill="#FCA5A5" opacity="0.25" filter="url(#softGlowLinq)" />
  <circle cx="600" cy="337" r="240" fill="#BAE6FD" opacity="0.3" filter="url(#softGlowLinq)" />
  <circle cx="880" cy="337" r="220" fill="#A7F3D0" opacity="0.25" filter="url(#softGlowLinq)" />

  <!-- Mathematical Coordinate & Pipeline Guides -->
  <g opacity="0.45" stroke="#CBD5E1" stroke-width="1">
    <line x1="80" y1="337" x2="1120" y2="337" stroke-dasharray="4,8" />
    <line x1="600" y1="60" x2="600" y2="615" stroke-dasharray="4,8" />
    
    <!-- Concentric Calibration Rings -->
    <circle cx="600" cy="337" r="260" fill="none" stroke-dasharray="3,6" />
    <circle cx="600" cy="337" r="380" fill="none" stroke-dasharray="2,8" opacity="0.6" />

    <!-- Isometric Alignment Vectors -->
    <line x1="200" y1="106" x2="1000" y2="568" stroke-dasharray="2,8" opacity="0.5" />
    <line x1="200" y1="568" x2="1000" y2="106" stroke-dasharray="2,8" opacity="0.5" />
  </g>

  <!-- FUNCTIONAL COMPOSITION MOTIF -->
  <g filter="url(#linqShadow)">

    <!-- LEFT: TANGLED & JAGGED IMPERATIVE SHARDS (High Cognitive Load) -->
    <polygon points="180,260 290,190 260,320" fill="url(#tangledGrad)" stroke="#EF4444" stroke-width="2" />
    <polygon points="210,340 340,310 270,430" fill="url(#tangledGrad)" stroke="#EF4444" stroke-width="2" />
    <polygon points="140,380 230,440 180,490" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" opacity="0.6" />
    <line x1="160" y1="220" x2="320" y2="460" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="6,4" />
    <line x1="120" y1="340" x2="360" y2="280" stroke="#DC2626" stroke-width="2" />

    <!-- Stream Transition Channel -->
    <path d="M 330 337 L 480 337" stroke="#0284C7" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round" />

    <!-- CENTER: THE DECLARATIVE PIPELINE NEXUS (Harmonious Polyhedral Origami) -->
    <!-- Center (600, 337) -->
    <g transform="translate(600, 337)">
      <!-- Top Facet (Azure Blue) -->
      <polygon points="0,-140 130,-65 0,10 -130,-65" fill="url(#cleanBlockGrad)" stroke="#7DD3FC" stroke-width="2" />

      <!-- Left Facet (Midnight Slate Core) -->
      <polygon points="-130,-65 0,10 0,155 -130,80" fill="#0F172A" stroke="#334155" stroke-width="2" />

      <!-- Right Facet (Emerald Pipeline Exit) -->
      <polygon points="0,10 130,-65 130,80 0,155" fill="#10B981" stroke="#6EE7B7" stroke-width="2" />

      <!-- Inner Precision Cutouts (Clean Composition Layers) -->
      <polygon points="0,-70 65,-30 0,10 -65,-30" fill="#FFFFFF" opacity="0.4" />
      <polygon points="0,10 65,-30 65,40 0,80" fill="#FFFFFF" opacity="0.2" />

      <!-- Pipeline Anchor Node -->
      <circle cx="0" cy="10" r="9" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
      <circle cx="0" cy="10" r="20" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="4,4" />
    </g>

    <!-- RIGHT: MODULAR COMPOSABLE HEXAGONAL PRISMS (Self-Documenting Code) -->
    <!-- Interlocking Clean Module 1 (Top-Right) -->
    <g transform="translate(820, 240) scale(0.65)">
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
      <polygon points="0,-70 60,-35 0,0 -60,-35" fill="#38BDF8" opacity="0.8" />
      <polygon points="-60,-35 0,0 0,70 -60,35" fill="#0F172A" />
      <polygon points="0,0 60,-35 60,35 0,70" fill="#0284C7" />
    </g>

    <!-- Interlocking Clean Module 2 (Center-Right) -->
    <g transform="translate(940, 337) scale(0.75)">
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#FFFFFF" stroke="#10B981" stroke-width="3" />
      <polygon points="0,-70 60,-35 0,0 -60,-35" fill="#34D399" opacity="0.8" />
      <polygon points="-60,-35 0,0 0,70 -60,35" fill="#0F172A" />
      <polygon points="0,0 60,-35 60,35 0,70" fill="#059669" />
    </g>

    <!-- Interlocking Clean Module 3 (Bottom-Right) -->
    <g transform="translate(820, 434) scale(0.65)">
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
      <polygon points="0,-70 60,-35 0,0 -60,-35" fill="#38BDF8" opacity="0.8" />
      <polygon points="-60,-35 0,0 0,70 -60,35" fill="#0F172A" />
      <polygon points="0,0 60,-35 60,35 0,70" fill="#0284C7" />
    </g>

    <!-- Interconnecting Modular Pipeline Traces -->
    <line x1="720" y1="337" x2="880" y2="337" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />
    <line x1="700" y1="300" x2="780" y2="250" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="6,4" />
    <line x1="700" y1="374" x2="780" y2="424" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="6,4" />

    <!-- Corner Framing Reticles -->
    <g stroke="#0F172A" stroke-width="2.5" fill="none">
      <path d="M 140 100 L 120 100 L 120 120" />
      <path d="M 1060 100 L 1080 100 L 1080 120" />
      <path d="M 140 575 L 120 575 L 120 555" />
      <path d="M 1060 575 L 1080 575 L 1080 555" />
    </g>
  </g>
</svg>
