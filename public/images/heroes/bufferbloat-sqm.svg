<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient (Signature Warm Cream) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF2F2" />
    </linearGradient>

    <linearGradient id="cardGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>

    <!-- Waveform Area Fills -->
    <linearGradient id="redAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="greenAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02" />
    </linearGradient>

    <!-- Panel Drop Shadow -->
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Calibration Grid Lines -->
  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1">
    <line x1="60" y1="50" x2="1140" y2="50" stroke-dasharray="4,8" />
    <line x1="60" y1="625" x2="1140" y2="625" stroke-dasharray="4,8" />
    <line x1="600" y1="50" x2="600" y2="625" stroke-dasharray="2,6" />
    <!-- Reticles -->
    <path d="M 50 50 L 70 50 M 60 40 L 60 60" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 1130 50 L 1150 50 M 1140 40 L 1140 60" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- ============================================================== -->
  <!-- TOP HEADLINE: THE ONLY PRIMARY TEXT (HUGE & CRISP)              -->
  <!-- ============================================================== -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#0F172A" letter-spacing="-2">
      BUFFERBLOAT BENCHMARK
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- SIDE-BY-SIDE PANELS: STRICTLY THE BIG NUMBERS & CLEAN GRAPHS    -->
  <!-- ============================================================== -->

  <!-- 1. LEFT PANEL: BEFORE (54 ms SPIKE) -->
  <g transform="translate(60, 150)" filter="url(#panelShadow)">
    <!-- Outer Card -->
    <rect width="520" height="460" rx="20" fill="url(#cardRedGrad)" stroke="#FCA5A5" stroke-width="2.5" />
    
    <!-- Big Number Metric -->
    <text x="40" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#DC2626" letter-spacing="-3">
      54 ms
    </text>

    <!-- Waveform Graph Container -->
    <g transform="translate(40, 160)">
      <rect width="440" height="250" rx="14" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5" />
      
      <!-- Baseline Reference Guide -->
      <line x1="0" y1="200" x2="440" y2="200" stroke="#FEE2E2" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="0" y1="50" x2="440" y2="50" stroke="#FEE2E2" stroke-width="1.5" stroke-dasharray="4,4" />

      <!-- Shaded Latency Spike Area -->
      <path d="M 0 200 
               L 80 200 
               L 110 90 
               L 145 115 
               L 190 35 
               L 230 40 
               L 270 55 
               L 310 75 
               L 350 30 
               L 385 85 
               L 415 195 
               L 440 195 
               L 440 240 
               L 0 240 Z" 
            fill="url(#redAreaGrad)" />

      <!-- High-Latency Curve Stroke -->
      <path d="M 0 200 
               L 80 200 
               L 110 90 
               L 145 115 
               L 190 35 
               L 230 40 
               L 270 55 
               L 310 75 
               L 350 30 
               L 385 85 
               L 415 195 
               L 440 195" 
            fill="none" 
            stroke="#DC2626" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Spike Peak Node -->
      <circle cx="190" cy="35" r="7" fill="#DC2626" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="350" cy="30" r="7" fill="#DC2626" stroke="#FFFFFF" stroke-width="2.5" />
    </g>
  </g>

  <!-- 2. RIGHT PANEL: AFTER (9 ms FLATLINE) -->
  <g transform="translate(620, 150)" filter="url(#panelShadow)">
    <!-- Outer Card -->
    <rect width="520" height="460" rx="20" fill="url(#cardGreenGrad)" stroke="#86EFAC" stroke-width="2.5" />
    
    <!-- Big Number Metric -->
    <text x="40" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#059669" letter-spacing="-3">
      9 ms
    </text>

    <!-- Waveform Graph Container -->
    <g transform="translate(40, 160)">
      <rect width="440" height="250" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5" />
      
      <!-- Baseline Reference Guide (Same scale as left) -->
      <line x1="0" y1="200" x2="440" y2="200" stroke="#F0FDF4" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="0" y1="50" x2="440" y2="50" stroke="#F0FDF4" stroke-width="1.5" stroke-dasharray="4,4" />

      <!-- Shaded Flatline Area -->
      <path d="M 0 200 
               L 80 200 
               L 110 185 
               L 150 178 
               L 190 168 
               L 230 174 
               L 270 165 
               L 310 175 
               L 350 165 
               L 390 175 
               L 415 198 
               L 440 198 
               L 440 240 
               L 0 240 Z" 
            fill="url(#greenAreaGrad)" />

      <!-- Controlled Latency Flatline Curve Stroke -->
      <path d="M 0 200 
               L 80 200 
               L 110 185 
               L 150 178 
               L 190 168 
               L 230 174 
               L 270 165 
               L 310 175 
               L 350 165 
               L 390 175 
               L 415 198 
               L 440 198" 
            fill="none" 
            stroke="#059669" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Controlled Ceiling Peak Node -->
      <circle cx="270" cy="165" r="6" fill="#059669" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="350" cy="165" r="6" fill="#059669" stroke="#FFFFFF" stroke-width="2.5" />
    </g>
  </g>

</svg>