<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <linearGradient id="cardRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF2F2" />
    </linearGradient>

    <linearGradient id="cardGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1">
    <line x1="60" y1="50" x2="1140" y2="50" stroke-dasharray="4,8" />
    <line x1="60" y1="625" x2="1140" y2="625" stroke-dasharray="4,8" />
  </g>

  <!-- Title -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#0F172A" letter-spacing="-2">
      EDITORIAL REBOOT
    </text>
  </g>

  <!-- Transformation Delta: 55 Articles Purged -> 6 Flagships Retained -->
  <g transform="translate(60, 150)">
    
    <!-- Left: Before (55 Articles Purged) -->
    <g filter="url(#panelShadow)">
      <rect width="520" height="460" rx="20" fill="url(#cardRedGrad)" stroke="#FCA5A5" stroke-width="2.5" />
      
      <g transform="translate(40, 60)">
        <rect width="200" height="44" rx="10" fill="#FEE2E2" />
        <text x="100" y="30" font-family="ui-monospace, monospace" font-size="20" font-weight="900" fill="#DC2626" text-anchor="middle">
          LEGACY NOISE
        </text>
      </g>

      <text x="40" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#DC2626" letter-spacing="-3">
        55
      </text>
      <text x="40" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#7F1D1D">
        ARTICLES
      </text>

      <!-- Strike-out Bar -->
      <line x1="30" y1="350" x2="470" y2="350" stroke="#DC2626" stroke-width="6" stroke-linecap="round" opacity="0.5" />
      <text x="40" y="410" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#991B1B">
        EDITORIAL PURGE
      </text>
    </g>

    <!-- Right: After (6 Flagship Architecture Deep Dives) -->
    <g transform="translate(560, 0)" filter="url(#panelShadow)">
      <rect width="520" height="460" rx="20" fill="url(#cardGreenGrad)" stroke="#86EFAC" stroke-width="2.5" />
      
      <g transform="translate(40, 60)">
        <rect width="220" height="44" rx="10" fill="#DCFCE7" />
        <text x="110" y="30" font-family="ui-monospace, monospace" font-size="20" font-weight="900" fill="#059669" text-anchor="middle">
          SYSTEMS SIGNAL
        </text>
      </g>

      <text x="40" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#059669" letter-spacing="-3">
        6
      </text>
      <text x="40" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#064E3B">
        FLAGSHIPS
      </text>

      <!-- Clean Emerald Verification Bar -->
      <line x1="30" y1="350" x2="470" y2="350" stroke="#059669" stroke-width="6" stroke-linecap="round" />
      <text x="40" y="410" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#065F46">
        EXECUTIVE FOCUS
      </text>
    </g>

  </g>
</svg>