<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F2EBE0" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.35">
    <line x1="60" y1="45" x2="1140" y2="45" stroke="#d5cbbe" stroke-dasharray="4,6" stroke-width="1.5" />
    <line x1="60" y1="630" x2="1140" y2="630" stroke="#d5cbbe" stroke-dasharray="4,6" stroke-width="1.5" />
    <line x1="60" y1="45" x2="60" y2="630" stroke="#d5cbbe" stroke-dasharray="4,6" stroke-width="1.5" />
    <line x1="1140" y1="45" x2="1140" y2="630" stroke="#d5cbbe" stroke-dasharray="4,6" stroke-width="1.5" />
  </g>

  <!-- Top Publication Header -->
  <g transform="translate(60, 48)">
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#0f172a" letter-spacing="-0.5">Editorial Architecture &amp; Autonomous Harness</text>
    <text x="0" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#64748b">Human engineering stances powered by an agentic delivery pipeline</text>
  </g>

  <!-- 3 Major Pipeline Pillars -->
  <g transform="translate(60, 150)">
    
    <!-- CARD 1: Human Stance -->
    <g transform="translate(0, 0)">
      <rect width="335" height="440" rx="20" fill="#FFFFFF" stroke="#cbd5e1" stroke-width="2.5" filter="url(#cardShadow)" />
      
      <!-- Pill Badge -->
      <rect x="26" y="26" width="160" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="106" y="51" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">100% HUMAN</text>

      <text x="26" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#0f172a">Engineering</text>
      <text x="26" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#0f172a">Leadership</text>

      <line x1="26" y1="172" x2="309" y2="172" stroke="#f1ede5" stroke-width="2" />

      <!-- High-impact Points -->
      <g transform="translate(26, 212)">
        <circle cx="8" cy="10" r="5" fill="#2563eb" />
        <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">20 Years Experience</text>
      </g>
      
      <g transform="translate(26, 280)">
        <circle cx="8" cy="10" r="5" fill="#2563eb" />
        <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Production Stance</text>
      </g>

      <g transform="translate(26, 348)">
        <circle cx="8" cy="10" r="5" fill="#2563eb" />
        <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Architectural Opinion</text>
      </g>
    </g>

    <!-- Connector 1 -->
    <path d="M 345 220 L 368 220" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)" />

    <!-- CARD 2: AI Harness -->
    <g transform="translate(372, 0)">
      <rect width="335" height="440" rx="20" fill="#FFFFFF" stroke="#f59e0b" stroke-width="3" filter="url(#cardShadow)" />
      
      <!-- Pill Badge -->
      <rect x="26" y="26" width="165" height="38" rx="19" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5" />
      <text x="108" y="51" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#b45309">AGENTIC HARNESS</text>

      <text x="26" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#0f172a">Autonomous</text>
      <text x="26" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#0f172a">Execution</text>

      <line x1="26" y1="172" x2="309" y2="172" stroke="#fef3c7" stroke-width="2" />

      <!-- High-impact Points -->
      <g transform="translate(26, 212)">
        <circle cx="8" cy="10" r="5" fill="#d97706" />
        <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Architectural Interview</text>
      </g>
      
      <g transform="translate(26, 280)">
        <circle cx="8" cy="10" r="5" fill="#d97706" />
        <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">7-Stage Waterfall</text>
      </g>

      <g transform="translate(26, 348)">
        <circle cx="8" cy="10" r="5" fill="#d97706" />
        <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Zero Hallucination</text>
      </g>
    </g>

    <!-- Connector 2 -->
    <path d="M 718 220 L 740 220" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrowEmerald)" />

    <!-- CARD 3: Modern Delivery -->
    <g transform="translate(745, 0)">
      <rect width="335" height="440" rx="20" fill="#FFFFFF" stroke="#10b981" stroke-width="2.5" filter="url(#cardShadow)" />
      
      <!-- Pill Badge -->
      <rect x="26" y="26" width="165" height="38" rx="19" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <text x="108" y="51" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#047857">STATIC ENGINE</text>

      <text x="26" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#0f172a">High-Speed</text>
      <text x="26" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#0f172a">Delivery</text>

      <line x1="26" y1="172" x2="309" y2="172" stroke="#e6f4ea" stroke-width="2" />

      <!-- High-impact Points -->
      <g transform="translate(26, 212)">
        <circle cx="8" cy="10" r="5" fill="#059669" />
        <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Astro 5 Architecture</text>
      </g>
      
      <g transform="translate(26, 280)">
        <circle cx="8" cy="10" r="5" fill="#059669" />
        <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Zero Client Runtime</text>
      </g>

      <g transform="translate(26, 348)">
        <circle cx="8" cy="10" r="5" fill="#059669" />
        <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Independent Platform</text>
      </g>
    </g>

  </g>
</svg>
