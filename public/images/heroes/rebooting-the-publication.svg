<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F2EBE0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Architectural Background Grid -->
  <g opacity="0.25">
    <line x1="80" y1="80" x2="1120" y2="80" stroke="#d5cbbe" stroke-dasharray="4,6" stroke-width="1" />
    <line x1="80" y1="595" x2="1120" y2="595" stroke="#d5cbbe" stroke-dasharray="4,6" stroke-width="1" />
    <line x1="80" y1="80" x2="80" y2="595" stroke="#d5cbbe" stroke-dasharray="4,6" stroke-width="1" />
    <line x1="1120" y1="80" x2="1120" y2="595" stroke="#d5cbbe" stroke-dasharray="4,6" stroke-width="1" />
    <circle cx="80" cy="80" r="3" fill="#b0a291" />
    <circle cx="1120" cy="80" r="3" fill="#b0a291" />
    <circle cx="80" cy="595" r="3" fill="#b0a291" />
    <circle cx="1120" cy="595" r="3" fill="#b0a291" />
  </g>

  <!-- Publication Header Badge -->
  <g transform="translate(100, 75)">
    <rect x="0" y="0" width="1000" height="42" rx="8" fill="#FFFFFF" stroke="#e6ded3" stroke-width="1" filter="url(#cardShadow)" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="40" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="1.5">LEOW KAH MAN • EDITORIAL ARCHITECTURE &amp; HARNESS</text>
    <text x="965" y="26" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b">VOL. 2026.1</text>
  </g>

  <!-- MAIN TOPOLOGY DIAGRAM -->
  <g transform="translate(100, 150)">
    
    <!-- CARD 1: Human Architectural Ideation -->
    <g transform="translate(0, 40)">
      <rect width="280" height="340" rx="16" fill="#FFFFFF" stroke="#e2d8cc" stroke-width="1.5" filter="url(#cardShadow)" />
      
      <!-- Top Accent Pill -->
      <rect x="24" y="24" width="130" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="89" y="41" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">100% HUMAN</text>

      <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Engineering</text>
      <text x="24" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Experience</text>

      <line x1="24" y1="130" x2="256" y2="130" stroke="#f1ede5" stroke-width="1.5" />

      <!-- Feature Bullets -->
      <g transform="translate(24, 155)">
        <circle cx="6" cy="6" r="3" fill="#2563eb" />
        <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">20 Years Battle Scars</text>
        <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Real-world production trade-offs</text>
      </g>

      <g transform="translate(24, 210)">
        <circle cx="6" cy="6" r="3" fill="#2563eb" />
        <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Human Ideation &amp; Thesis</text>
        <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Core engineering stance</text>
      </g>

      <g transform="translate(24, 265)">
        <circle cx="6" cy="6" r="3" fill="#2563eb" />
        <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Architectural Stance</text>
        <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Engineering pragmatism</text>
      </g>
    </g>

    <!-- CONNECTOR 1 -->
    <path d="M 285 210 L 350 210" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />

    <!-- CARD 2: AI Execution Harness -->
    <g transform="translate(360, 40)">
      <rect width="280" height="340" rx="16" fill="#FFFFFF" stroke="#d97706" stroke-width="2" filter="url(#cardShadow)" />
      
      <!-- Top Accent Pill -->
      <rect x="24" y="24" width="130" height="26" rx="13" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
      <text x="89" y="41" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b45309">DRAFTING ENGINE</text>

      <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Autonomous</text>
      <text x="24" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">AI Harness</text>

      <line x1="24" y1="130" x2="256" y2="130" stroke="#fef3c7" stroke-width="1.5" />

      <!-- Feature Bullets -->
      <g transform="translate(24, 155)">
        <circle cx="6" cy="6" r="3" fill="#d97706" />
        <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Drafting Velocity</text>
        <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Zero time-sink friction</text>
      </g>

      <g transform="translate(24, 210)">
        <circle cx="6" cy="6" r="3" fill="#d97706" />
        <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Prose Synthesis</text>
        <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Polished technical flow</text>
      </g>

      <g transform="translate(24, 265)">
        <circle cx="6" cy="6" r="3" fill="#d97706" />
        <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Automated Formatting</text>
        <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Vector schematics &amp; schemas</text>
      </g>
    </g>

    <!-- CONNECTOR 2 -->
    <path d="M 645 210 L 710 210" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)" />

    <!-- CARD 3: Modern High-Signal Publication -->
    <g transform="translate(720, 40)">
      <rect width="280" height="340" rx="16" fill="#FFFFFF" stroke="#e2d8cc" stroke-width="1.5" filter="url(#cardShadow)" />
      
      <!-- Top Accent Pill -->
      <rect x="24" y="24" width="130" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
      <text x="89" y="41" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857">HIGH SIGNAL</text>

      <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Minimalist</text>
      <text x="24" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Publication</text>

      <line x1="24" y1="130" x2="256" y2="130" stroke="#f1ede5" stroke-width="1.5" />

      <!-- Feature Bullets -->
      <g transform="translate(24, 155)">
        <circle cx="6" cy="6" r="3" fill="#10b981" />
        <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Astro 5 &amp; Tailwind</text>
        <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Instant static delivery</text>
      </g>

      <g transform="translate(24, 210)">
        <circle cx="6" cy="6" r="3" fill="#10b981" />
        <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">Zero Bloat / Trackers</text>
        <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">Purged 49 obsolete posts</text>
      </g>

      <g transform="translate(24, 265)">
        <circle cx="6" cy="6" r="3" fill="#10b981" />
        <text x="18" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">LinkedIn Discussions</text>
        <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b">High-context peer network</text>
      </g>
    </g>
  </g>

  <!-- Bottom Subtitle Bar -->
  <g transform="translate(100, 560)">
    <rect width="1000" height="48" rx="10" fill="#FFFFFF" stroke="#e2d8cc" stroke-width="1" filter="url(#cardShadow)" />
    <text x="500" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#475569">
      HUMAN ARCHITECTURAL OPINION • AI EXECUTION VELOCITY • MINIMALIST STATIC DELIVERY
    </text>
  </g>
</svg>
