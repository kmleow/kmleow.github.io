<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-cream2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-cream2)" />
  
  <!-- Header Text -->
  <g transform="translate(80, 50)">
    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0f172a">Policy-Based Routing with iproute2 &amp; fwmark</text>
    <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" fill="#0284c7">Multi-Gateway Traffic Steering &amp; Kernel Classification</text>
  </g>
  
  <g transform="translate(80, 160)">
    <!-- Box 1: Ingress Classifier -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="440" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#cardShadow)" />
      
      <!-- Pill Badge -->
      <rect x="25" y="25" width="140" height="36" rx="18" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
      <text x="95" y="49" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0284c7">INGRESS</text>

      <text x="25" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#0f172a">Traffic</text>
      <text x="25" y="138" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#0f172a">Classifier</text>
      
      <line x1="25" y1="165" x2="285" y2="165" stroke="#f1f5f9" stroke-width="2" />

      <!-- Bullets -->
      <g transform="translate(25, 210)">
        <circle cx="8" cy="8" r="5" fill="#0284c7" />
        <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">LAN Source Subnets</text>
      </g>
      <g transform="translate(25, 275)">
        <circle cx="8" cy="8" r="5" fill="#0284c7" />
        <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Dynamic IPsets</text>
      </g>
      <g transform="translate(25, 340)">
        <circle cx="8" cy="8" r="5" fill="#0284c7" />
        <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Domain-Based Tags</text>
      </g>
      
      <!-- Bottom Badge -->
      <rect x="25" y="380" width="260" height="40" rx="10" fill="#e0f2fe" />
      <text x="155" y="406" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#0369a1">DYNAMIC TAGGING</text>
    </g>
    
    <!-- Box 2: Kernel Classifier & Routing Rule -->
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="410" height="440" rx="20" fill="#ffffff" stroke="#38bdf8" stroke-width="2.5" filter="url(#cardShadow)" />
      
      <!-- Pill Badge -->
      <rect x="25" y="25" width="160" height="36" rx="18" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
      <text x="105" y="49" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0284c7">KERNEL ROUTING</text>

      <text x="25" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#0369a1">Netfilter &amp; FIB</text>
      <text x="25" y="138" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#0369a1">Rule Classifier</text>
      
      <line x1="25" y1="165" x2="385" y2="165" stroke="#f0f9ff" stroke-width="2" />

      <!-- Code Snippets (Large Monospace) -->
      <rect x="25" y="190" width="360" height="150" rx="12" fill="#0f172a" />
      <text x="45" y="235" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#38bdf8">iptables -j MARK 0x100</text>
      <line x1="45" y1="255" x2="365" y2="255" stroke="#334155" stroke-width="1.5" />
      <text x="45" y="295" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#fbbf24">ip rule fwmark 0x100</text>
      <text x="45" y="322" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#fbbf24">   lookup table 100</text>

      <!-- Bottom Badge -->
      <rect x="25" y="380" width="360" height="40" rx="10" fill="#e0f2fe" />
      <text x="205" y="406" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#0284c7">DETERMINISTIC ROUTING</text>
    </g>
    
    <!-- Box 3: Egress Routing Targets -->
    <g transform="translate(780, 0)">
      <!-- Top Target: Fiber WAN -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="260" height="205" rx="20" fill="#ffffff" stroke="#86efac" stroke-width="2.5" filter="url(#cardShadow)" />
        <circle cx="28" cy="36" r="8" fill="#10b981" />
        <text x="48" y="43" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#065f46">Default WAN</text>
        <text x="28" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Direct Fiber Uplink</text>
        <rect x="25" y="130" width="210" height="45" rx="10" fill="#d1fae5" />
        <text x="130" y="159" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#065f46">FIB Table: main</text>
      </g>
      
      <!-- Bottom Target: VPN Tunnel -->
      <g transform="translate(0, 235)">
        <rect x="0" y="0" width="260" height="205" rx="20" fill="#ffffff" stroke="#fde047" stroke-width="2.5" filter="url(#cardShadow)" />
        <circle cx="28" cy="36" r="8" fill="#eab308" />
        <text x="48" y="43" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#854d0e">Secure Tunnel</text>
        <text x="28" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Encrypted Transit</text>
        <rect x="25" y="130" width="210" height="45" rx="10" fill="#fef3c7" />
        <text x="130" y="159" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#854d0e">FIB Table: 100</text>
      </g>
    </g>
  </g>
</svg>
