<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg-cream2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F4EFE6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-cream2)" />
  <g opacity="0.04">
    <pattern id="grid-pbr" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid-pbr)" />
  </g>
  <text x="100" y="145" font-family="system-ui, sans-serif" font-weight="800" font-size="42" fill="#0f172a">Policy-Based Routing with iproute2 &amp; fwmark</text>
  <text x="100" y="195" font-family="system-ui, sans-serif" font-weight="600" font-size="22" fill="#0284c7">Multi-Gateway Traffic Steering &amp; Target Classification</text>
  
  <g transform="translate(100, 260)">
    <!-- Ingress Traffic -->
    <rect x="0" y="50" width="230" height="200" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.03))" />
    <text x="28" y="92" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#0f172a">LAN Ingress Traffic</text>
    <text x="28" y="125" font-family="system-ui, sans-serif" font-size="14" fill="#475569">• Source Subnets</text>
    <text x="28" y="152" font-family="system-ui, sans-serif" font-size="14" fill="#475569">• Destination CIDRs</text>
    <text x="28" y="179" font-family="system-ui, sans-serif" font-size="14" fill="#475569">• IPset Domain Tags</text>
    <text x="28" y="215" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0284c7">Dynamic Classification</text>
    
    <!-- Engine -->
    <rect x="310" y="20" width="380" height="260" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))" />
    <text x="340" y="62" font-family="system-ui, sans-serif" font-weight="700" font-size="19" fill="#0369a1">Netfilter &amp; ip rule Classifier</text>
    <text x="340" y="98" font-family="ui-monospace, monospace" font-size="13" fill="#0f172a">iptables -t mangle -A PREROUTING</text>
    <text x="340" y="122" font-family="ui-monospace, monospace" font-size="13" fill="#0369a1">-m set --match-set targets dst</text>
    <text x="340" y="146" font-family="ui-monospace, monospace" font-size="13" fill="#0369a1">-j MARK --set-mark 0x100</text>
    <line x1="340" y1="168" x2="650" y2="168" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="340" y="198" font-family="ui-monospace, monospace" font-size="13" fill="#b45309">ip rule add fwmark 0x100 table 100</text>
    <text x="340" y="224" font-family="ui-monospace, monospace" font-size="13" fill="#b45309">ip route add default dev tun0 table 100</text>
    <text x="340" y="255" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#10b981">✓ Deterministic Table Selection</text>
    
    <!-- Egress Gateways -->
    <rect x="770" y="20" width="230" height="115" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="2" />
    <text x="795" y="58" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#065f46">Default WAN</text>
    <text x="795" y="86" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Direct Fiber Uplink</text>
    <text x="795" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">FIB Table: main</text>
    
    <rect x="770" y="165" width="230" height="115" rx="14" fill="#ffffff" stroke="#fde047" stroke-width="2" />
    <text x="795" y="203" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#854d0e">Secure Tunnel</text>
    <text x="795" y="231" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Encrypted Transit</text>
    <text x="795" y="255" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">FIB Table: 100 (tun0)</text>
  </g>
</svg>