<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <linearGradient id="policyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>

    <marker id="wanArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="vpnArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1">
    <line x1="60" y1="50" x2="1140" y2="50" stroke-dasharray="4,8" />
    <line x1="60" y1="625" x2="1140" y2="625" stroke-dasharray="4,8" />
  </g>

  <!-- Title -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#0F172A" letter-spacing="-2">
      POLICY-BASED ROUTING
    </text>
  </g>

  <!-- Split Routing Flow -->
  <g transform="translate(60, 180)">
    
    <!-- Step 1: Ingress Traffic -->
    <g filter="url(#cardShadow)">
      <rect width="300" height="380" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <text x="150" y="160" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#0F172A" text-anchor="middle">
        INGRESS
      </text>
      <text x="150" y="215" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#64748B" text-anchor="middle">
        TRAFFIC
      </text>
    </g>

    <!-- Conduit to Kernel Policy Engine -->
    <path d="M 300 280 L 400 280" fill="none" stroke="#0F172A" stroke-width="6" />

    <!-- Step 2: Policy Steering (fwmark / ipset) -->
    <g transform="translate(400, 0)" filter="url(#cardShadow)">
      <rect width="320" height="380" rx="20" fill="url(#policyGrad)" stroke="#475569" stroke-width="2" />
      <text x="160" y="140" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" text-anchor="middle">
        KERNEL
      </text>
      <text x="160" y="190" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC" text-anchor="middle">
        POLICY
      </text>
      <g transform="translate(35, 230)">
        <rect width="250" height="70" rx="14" fill="#334155" />
        <text x="125" y="46" font-family="ui-monospace, monospace" font-size="24" font-weight="800" fill="#F59E0B" text-anchor="middle">
          FWMARK / IPSET
        </text>
      </g>
    </g>

    <!-- Split Conduits (Upper WAN vs Lower VPN) -->
    <!-- Direct WAN -->
    <path d="M 720 230 L 780 230 L 780 140 L 830 140" fill="none" stroke="#2563EB" stroke-width="6" marker-end="url(#wanArrow)" />
    
    <!-- VPN Tunnel -->
    <path d="M 720 330 L 780 330 L 780 420 L 830 420" fill="none" stroke="#059669" stroke-width="6" marker-end="url(#vpnArrow)" />

    <!-- Step 3A: Direct WAN Gateway -->
    <g transform="translate(840, 50)" filter="url(#cardShadow)">
      <rect width="240" height="180" rx="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3" />
      <text x="120" y="90" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#1E40AF" text-anchor="middle">
        DIRECT
      </text>
      <text x="120" y="130" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#1E40AF" text-anchor="middle">
        WAN
      </text>
    </g>

    <!-- Step 3B: VPN Tunnel Gateway -->
    <g transform="translate(840, 330)" filter="url(#cardShadow)">
      <rect width="240" height="180" rx="18" fill="#ECFDF5" stroke="#10B981" stroke-width="3" />
      <text x="120" y="90" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#065F46" text-anchor="middle">
        VPN
      </text>
      <text x="120" y="130" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#065F46" text-anchor="middle">
        TUNNEL
      </text>
    </g>

  </g>
</svg>