<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradCicd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <linearGradient id="purpleTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="purpleRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <linearGradient id="cyanPlane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.1" />
    </linearGradient>

    <filter id="cicdShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <filter id="softGlowCicd" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradCicd)" />

  <!-- Ambient Light Field -->
  <circle cx="600" cy="337" r="280" fill="#DDD6FE" opacity="0.3" filter="url(#softGlowCicd)" />
  <circle cx="380" cy="240" r="180" fill="#BAE6FD" opacity="0.25" filter="url(#softGlowCicd)" />

  <!-- Isometric Blueprint Grid & Modular Guides -->
  <g opacity="0.45" stroke="#CBD5E1" stroke-width="1">
    <!-- Isometric Rays (30° / 60°) -->
    <line x1="120" y1="60" x2="1080" y2="615" stroke-dasharray="3,8" />
    <line x1="120" y1="615" x2="1080" y2="60" stroke-dasharray="3,8" />
    
    <!-- Coordinate Rings -->
    <circle cx="600" cy="337" r="260" fill="none" stroke-dasharray="4,8" />
    <circle cx="600" cy="337" r="380" fill="none" stroke-dasharray="2,6" opacity="0.6" />

    <!-- Horizontal & Vertical Center Guides -->
    <line x1="100" y1="337" x2="1100" y2="337" stroke-dasharray="4,8" />
    <line x1="600" y1="60" x2="600" y2="615" stroke-dasharray="4,8" />
  </g>

  <!-- MODULAR ISOMETRIC CONTAINER MOTIF -->
  <g filter="url(#cicdShadow)">

    <!-- Sweeping Build Foundation Plane (Cyan/Blue Translucent Sheet) -->
    <polygon points="260,380 600,180 940,380 600,580" fill="url(#cyanPlane)" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,6" />

    <!-- CONTAINER 1: INCOMING WEBHOOK / DISPATCH (Left, Floating Blue Cube) -->
    <g transform="translate(320, 240) scale(0.7)">
      <!-- Top -->
      <polygon points="0,-80 80,-35 0,10 -80,-35" fill="#3B82F6" stroke="#93C5FD" stroke-width="2" />
      <!-- Left -->
      <polygon points="-80,-35 0,10 0,100 -80,55" fill="#1E293B" stroke="#334155" stroke-width="2" />
      <!-- Right -->
      <polygon points="0,10 80,-35 80,55 0,100" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2" />
      <circle cx="0" cy="10" r="6" fill="#FFFFFF" />
    </g>

    <!-- INTERCONNECTING BUS TRACES (Event Trigger) -->
    <line x1="375" y1="250" x2="520" y2="320" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6,6" />
    <line x1="680" y1="320" x2="825" y2="250" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6,6" />

    <!-- CONTAINER 2: CENTRAL EPHEMERAL SANDBOX (Large Isometric Cube) -->
    <!-- Center (600, 320) -->
    <g transform="translate(600, 320)">
      <!-- Top Facet (Royal Violet) -->
      <polygon points="0,-140 130,-65 0,10 -130,-65" fill="url(#purpleTop)" stroke="#C4B5FD" stroke-width="2" />

      <!-- Left Facet (Midnight Slate Core) -->
      <polygon points="-130,-65 0,10 0,155 -130,80" fill="#0F172A" stroke="#334155" stroke-width="2" />

      <!-- Right Facet (Deep Purple Wall) -->
      <polygon points="0,10 130,-65 130,80 0,155" fill="url(#purpleRight)" stroke="#A78BFA" stroke-width="2" />

      <!-- Inner Slotted Container Ribs (Dock / Chassis Motif) -->
      <line x1="-90" y1="-15" x2="-90" y2="60" stroke="#334155" stroke-width="2" />
      <line x1="-45" y1="5" x2="-45" y2="80" stroke="#334155" stroke-width="2" />
      <line x1="45" y1="5" x2="45" y2="80" stroke="#8B5CF6" stroke-width="2" opacity="0.6" />
      <line x1="90" y1="-15" x2="90" y2="60" stroke="#8B5CF6" stroke-width="2" opacity="0.6" />

      <!-- High-Energy Ephemeral Node -->
      <circle cx="0" cy="10" r="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3.5" />
      <circle cx="0" cy="10" r="22" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="4,4" />
    </g>

    <!-- CONTAINER 3: DISSOLVING / RECLAIMED GHOST WIREFRAME (Right, Clean Auto-Destruction) -->
    <g transform="translate(880, 240) scale(0.7)">
      <!-- Top Wireframe -->
      <polygon points="0,-80 80,-35 0,10 -80,-35" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,6" />
      <!-- Left Wireframe -->
      <polygon points="-80,-35 0,10 0,100 -80,55" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" />
      <!-- Right Wireframe -->
      <polygon points="0,10 80,-35 80,55 0,100" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" />
      <circle cx="0" cy="10" r="6" fill="#10B981" />
    </g>

    <!-- Precision Calibration Nodes Around Sandboxes -->
    <circle cx="480" cy="440" r="6" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="720" cy="440" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="600" cy="180" r="7" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2" />

    <!-- Corner Framing Reticles -->
    <g stroke="#0F172A" stroke-width="2.5" fill="none">
      <path d="M 140 100 L 120 100 L 120 120" />
      <path d="M 1060 100 L 1080 100 L 1080 120" />
      <path d="M 140 575 L 120 575 L 120 555" />
      <path d="M 1060 575 L 1080 575 L 1080 555" />
    </g>
  </g>
</svg>
