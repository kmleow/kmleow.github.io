<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#ECE2D0" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="runnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>

    <marker id="flowArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.35" stroke="#CBD5E1" stroke-width="1">
    <line x1="60" y1="50" x2="1140" y2="50" stroke-dasharray="4,8" />
    <line x1="60" y1="625" x2="1140" y2="625" stroke-dasharray="4,8" />
  </g>

  <!-- Title -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#0F172A" letter-spacing="-2">
      CONTAINERISED CI/CD RUNNERS
    </text>
  </g>

  <!-- 3 Macro-Steps: Cloud -> Daemon -> Ephemeral Docker -->
  <!-- Bounded strictly within [60, 1140] (Available width = 1080) -->
  <g transform="translate(60, 180)">
    
    <!-- Step 1: Cloud Orchestrator (width = 310) -->
    <g filter="url(#cardShadow)">
      <rect width="310" height="380" rx="20" fill="url(#cloudGrad)" />
      <text x="155" y="160" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">
        CLOUD
      </text>
      <text x="155" y="215" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#DBEAFE" text-anchor="middle">
        CI / CD
      </text>
    </g>

    <!-- Outbound Polling Arrow (Gap 310 -> 385) -->
    <path d="M 310 280 L 385 280" fill="none" stroke="#0F172A" stroke-width="6" marker-end="url(#flowArrow)" />

    <!-- Step 2: Private Runner Daemon (width = 310) -->
    <g transform="translate(385, 0)" filter="url(#cardShadow)">
      <rect width="310" height="380" rx="20" fill="url(#runnerGrad)" stroke="#475569" stroke-width="2" />
      <text x="155" y="160" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#F8FAFC" text-anchor="middle">
        RUNNER
      </text>
      <text x="155" y="215" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#38BDF8" text-anchor="middle">
        DAEMON
      </text>
    </g>

    <!-- Spawn Container Arrow (Gap 695 -> 770) -->
    <path d="M 695 280 L 770 280" fill="none" stroke="#0F172A" stroke-width="6" marker-end="url(#flowArrow)" />

    <!-- Step 3: Disposable Docker Sandbox (width = 310, ends at 1080 -> total X = 1140) -->
    <g transform="translate(770, 0)" filter="url(#cardShadow)">
      <rect width="310" height="380" rx="20" fill="url(#dockerGrad)" />
      <text x="155" y="160" font-family="system-ui, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle">
        DOCKER
      </text>
      <text x="155" y="215" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#E0F2FE" text-anchor="middle">
        SANDBOX
      </text>
    </g>

  </g>
</svg>