<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="auto">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>

    <filter id="diagShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Background Base Container -->
  <rect width="960" height="620" rx="16" fill="url(#diagBg)" stroke="#e2d8cc" stroke-width="1.5" />

  <!-- TIER 1: FRONTIER CLOUD CURATION -->
  <g transform="translate(40, 24)">
    <rect width="880" height="105" rx="14" fill="#FFFFFF" stroke="#93c5fd" stroke-width="2" filter="url(#diagShadow)" />
    <!-- Section Badge -->
    <rect x="20" y="12" width="220" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="130" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8" letter-spacing="0.5">PHASE 1: FRONTIER CLOUD LLM</text>

    <!-- Sub-nodes -->
    <g transform="translate(20, 44)">
      <rect width="250" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="125" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Gemini Flash (Frontier)</text>
    </g>

    <path d="M 275 68 L 320 68" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)" />

    <g transform="translate(330, 44)">
      <rect width="260" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="130" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Montessori JSON Schema</text>
    </g>

    <path d="M 595 68 L 640 68" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)" />

    <g transform="translate(650, 44)">
      <rect width="210" height="48" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
      <text x="105" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af">498 Curated Prompts</text>
    </g>
  </g>

  <!-- Downward Transition: Cloud to Daily Driver -->
  <g transform="translate(480, 130)">
    <path d="M 0 0 L 0 35" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowBlue)" />
    <rect x="-105" y="8" width="210" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="0" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">REST API BATCH INGEST</text>
  </g>

  <!-- TIER 2: DAILY DRIVER HARDWARE INFERENCE -->
  <g transform="translate(40, 168)">
    <rect width="880" height="110" rx="14" fill="#FFFFFF" stroke="#f59e0b" stroke-width="2" filter="url(#diagShadow)" />
    <!-- Section Badge -->
    <rect x="20" y="12" width="240" height="24" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <text x="140" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#b45309" letter-spacing="0.5">PHASE 2: LOCAL dGPU INFERENCE</text>

    <!-- Sub-nodes -->
    <g transform="translate(20, 44)">
      <rect width="250" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="125" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Intel OpenVINO Server</text>
      <text x="125" y="43" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">ovms-image (Docker)</text>
    </g>

    <path d="M 275 70 L 320 70" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)" />

    <g transform="translate(330, 44)">
      <rect width="260" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" />
      <text x="130" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#92400e">Intel Arc A770M (16GB)</text>
      <text x="130" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309">100% Dedicated VRAM</text>
    </g>

    <path d="M 595 70 L 640 70" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)" />

    <g transform="translate(650, 44)">
      <rect width="210" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="105" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">FLUX.1 Schnell INT8</text>
      <text x="105" y="43" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#059669">~11s Latency / 1024x1024</text>
    </g>
  </g>

  <!-- Downward Transition: dGPU to Vetting -->
  <g transform="translate(480, 278)">
    <path d="M 0 0 L 0 35" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />
  </g>

  <!-- TIER 3: VISUAL VETTING & NORMALISATION -->
  <g transform="translate(40, 314)">
    <rect width="880" height="120" rx="14" fill="#FFFFFF" stroke="#0f172a" stroke-width="2" filter="url(#diagShadow)" />
    <!-- Section Badge -->
    <rect x="20" y="12" width="270" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="155" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a" letter-spacing="0.5">PHASE 3: VETTING &amp; ASSET PACKAGING</text>

    <!-- Sub-nodes -->
    <g transform="translate(20, 48)">
      <rect width="280" height="56" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
      <text x="140" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#991b1b">Visual Vetting Studio</text>
      <text x="140" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#dc2626">Filter 4-finger hands / 80% discard</text>
    </g>

    <!-- Regeneration Feedback Loop Arrow -->
    <path d="M 160 48 L 160 20 Q 160 -15 130 -15 L 70 -15 Q 40 -15 40 -40 L 40 -70" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowDark)" />
    <rect x="50" y="-30" width="100" height="18" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="100" y="-17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#991b1b">RE-PROMPT</text>

    <path d="M 305 76 L 345 76" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowEmerald)" />

    <!-- Parallel Approved Assets Box -->
    <g transform="translate(355, 44)">
      <rect width="240" height="64" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <text x="120" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#065f46">Approved Visuals (WebP)</text>
      <text x="120" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#047857">1024x1024 @ 82q (~20KB)</text>
      <text x="120" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">+ Pre-generated MP3 Audio</text>
    </g>

    <path d="M 600 76 L 640 76" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowEmerald)" />

    <g transform="translate(650, 48)">
      <rect width="210" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" />
      <text x="105" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#065f46">Bundled Application</text>
      <text x="105" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">Svelte 5 Runes (&lt;15 MB)</text>
    </g>
  </g>

  <!-- Downward Split Arrows to Delivery -->
  <g transform="translate(480, 435)">
    <path d="M 0 0 L 0 25" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <path d="M -180 25 L 180 25" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <path d="M -180 25 L -180 40" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrowDark)" />
    <path d="M 180 25 L 180 40" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrowDark)" />
  </g>

  <!-- TIER 4: MULTI-TARGET DELIVERY -->
  <g transform="translate(40, 480)">
    <!-- Delivery Target A: Android Mobile -->
    <g transform="translate(60, 0)">
      <rect width="340" height="110" rx="12" fill="#FFFFFF" stroke="#3b82f6" stroke-width="2" filter="url(#diagShadow)" />
      <rect x="15" y="12" width="160" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <text x="95" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d4ed8">TARGET A: MOBILE APK</text>
      <text x="170" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Capacitor 8 Native Android</text>
      <text x="170" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Touch Navigation • 100% Offline</text>
      <text x="170" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#2563eb">Zero CDN / Zero In-App Ads</text>
    </g>

    <!-- Delivery Target B: Homelab TV -->
    <g transform="translate(480, 0)">
      <rect width="340" height="110" rx="12" fill="#FFFFFF" stroke="#10b981" stroke-width="2" filter="url(#diagShadow)" />
      <rect x="15" y="12" width="160" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
      <text x="95" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">TARGET B: HOMELAB TV</text>
      <text x="170" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Docker + Nginx on Alpine</text>
      <text x="170" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Android TV D-Pad Remote</text>
      <text x="170" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">Rolling 3-Image O(1) Window</text>
    </g>
  </g>
</svg>
