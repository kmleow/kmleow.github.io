<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="auto">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <filter id="dShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="dArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="dArrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <rect width="900" height="270" rx="16" fill="url(#dGrad)" stroke="#e5ded4" stroke-width="1.5" />

  <!-- Step 1: Human War Stories -->
  <g transform="translate(30, 35)">
    <rect width="255" height="200" rx="14" fill="#FFFFFF" stroke="#cbd5e1" stroke-width="2" filter="url(#dShadow)" />
    <rect x="18" y="16" width="115" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="75" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">100% HUMAN</text>
    <text x="18" y="74" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Engineering</text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Experience</text>
    <line x1="18" y1="114" x2="237" y2="114" stroke="#f1ede5" stroke-width="1.5" />
    <text x="18" y="142" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• 20 years production battles</text>
    <text x="18" y="168" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• Authentic architectural stance</text>
    <text x="18" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">Real-world trade-off analysis</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 295 135 L 325 135" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#dArrow)" />

  <!-- Step 2: AI Execution Harness -->
  <g transform="translate(335, 35)">
    <rect width="260" height="200" rx="14" fill="#FFFFFF" stroke="#f59e0b" stroke-width="2.5" filter="url(#dShadow)" />
    <rect x="18" y="16" width="130" height="26" rx="13" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="83" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#b45309">DRAFTING ENGINE</text>
    <text x="18" y="74" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Autonomous AI</text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Synthesis Harness</text>
    <line x1="18" y1="114" x2="242" y2="114" stroke="#fef3c7" stroke-width="1.5" />
    <text x="18" y="142" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• Solves drafting time sink</text>
    <text x="18" y="168" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• High-velocity synthesis</text>
    <text x="18" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">Disciplined prose &amp; schematics</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 605 135 L 635 135" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#dArrowAmber)" />

  <!-- Step 3: High Signal Publication -->
  <g transform="translate(645, 35)">
    <rect width="225" height="200" rx="14" fill="#FFFFFF" stroke="#10b981" stroke-width="2" filter="url(#dShadow)" />
    <rect x="18" y="16" width="115" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="75" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#047857">HIGH SIGNAL</text>
    <text x="18" y="74" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Published</text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Essays</text>
    <line x1="18" y1="114" x2="207" y2="114" stroke="#ecfdf5" stroke-width="1.5" />
    <text x="18" y="142" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• Clear takeaways</text>
    <text x="18" y="168" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• Proven architectures</text>
    <text x="18" y="188" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">Zero tutorial noise</text>
  </g>
</svg>
