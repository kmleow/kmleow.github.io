<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <filter id="dShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
    <marker id="dArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="dArrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="dArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="900" height="240" rx="16" fill="url(#dGrad)" stroke="#e5ded4" stroke-width="1.5" />

  <!-- Step 1: Human War Stories -->
  <g transform="translate(35, 45)">
    <rect width="240" height="150" rx="12" fill="#FFFFFF" stroke="#e2d8cc" stroke-width="1.5" filter="url(#dShadow)" />
    <rect x="16" y="14" width="90" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="61" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">100% HUMAN</text>
    <text x="16" y="58" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Engineering Experience</text>
    <text x="16" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">&amp; Core Thesis</text>
    <line x1="16" y1="92" x2="224" y2="92" stroke="#f1ede5" stroke-width="1" />
    <text x="16" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b">• 20 years production war stories</text>
    <text x="16" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b">• Real-world architectural trade-offs</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 285 120 L 330 120" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#dArrow)" />

  <!-- Step 2: AI Execution Harness -->
  <g transform="translate(340, 45)">
    <rect width="240" height="150" rx="12" fill="#FFFFFF" stroke="#f59e0b" stroke-width="2" filter="url(#dShadow)" />
    <rect x="16" y="14" width="95" height="20" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="63" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">DRAFTING ENGINE</text>
    <text x="16" y="58" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Autonomous AI</text>
    <text x="16" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Synthesis Harness</text>
    <line x1="16" y1="92" x2="224" y2="92" stroke="#fef3c7" stroke-width="1" />
    <text x="16" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b">• Solves drafting time sink</text>
    <text x="16" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b">• High-velocity prose &amp; schematics</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 590 120 L 635 120" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#dArrowAmber)" />

  <!-- Step 3: High Signal Publication -->
  <g transform="translate(645, 45)">
    <rect width="220" height="150" rx="12" fill="#FFFFFF" stroke="#10b981" stroke-width="1.5" filter="url(#dShadow)" />
    <rect x="16" y="14" width="85" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="58" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">HIGH SIGNAL</text>
    <text x="16" y="58" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Published Essay</text>
    <text x="16" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">&amp; Executive Value</text>
    <line x1="16" y1="92" x2="204" y2="92" stroke="#ecfdf5" stroke-width="1" />
    <text x="16" y="112" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b">• Clear leadership takeaways</text>
    <text x="16" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b">• Tested architectures</text>
  </g>
</svg>
