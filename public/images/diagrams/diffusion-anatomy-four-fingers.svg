<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="auto">
  <defs>
    <linearGradient id="flawBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <filter id="flawShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="880" height="340" rx="14" fill="url(#flawBg)" stroke="#e2d8cc" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(30, 20)">
    <rect width="470" height="28" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <text x="235" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#991b1b" letter-spacing="0.5">EMPIRICAL HARDWARE OBSERVATION: THE 80% DISCARD RATE</text>
  </g>

  <!-- Left Card: Defect Anatomy Inspection -->
  <g transform="translate(30, 60)">
    <rect width="400" height="250" rx="12" fill="#FFFFFF" stroke="#f87171" stroke-width="2" filter="url(#flawShadow)" />
    
    <!-- Header -->
    <rect x="16" y="14" width="220" height="24" rx="12" fill="#fee2e2" />
    <text x="126" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#b91c1c">ANATOMICAL DEFECT DETECTED</text>

    <!-- Visual Hand Representation -->
    <g transform="translate(60, 55)">
      <!-- Palm Base -->
      <path d="M 40 100 C 30 70 50 40 80 40 C 110 40 130 70 120 100 Z" fill="#fed7aa" stroke="#ea580c" stroke-width="2" />
      
      <!-- Thumb (Digit 1) -->
      <path d="M 42 75 C 20 65 15 50 25 42 C 35 35 45 50 50 60" fill="#fed7aa" stroke="#ea580c" stroke-width="2" stroke-linecap="round" />
      <circle cx="20" cy="40" r="10" fill="#ef4444" />
      <text x="20" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">1</text>

      <!-- Finger 2 -->
      <path d="M 58 42 C 55 20 65 10 72 10 C 80 10 82 25 78 42" fill="#fed7aa" stroke="#ea580c" stroke-width="2" stroke-linecap="round" />
      <circle cx="72" cy="5" r="10" fill="#ef4444" />
      <text x="72" y="9" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">2</text>

      <!-- Finger 3 -->
      <path d="M 80 42 C 82 18 92 8 100 8 C 108 8 110 22 102 42" fill="#fed7aa" stroke="#ea580c" stroke-width="2" stroke-linecap="round" />
      <circle cx="100" cy="5" r="10" fill="#ef4444" />
      <text x="100" y="9" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">3</text>

      <!-- Finger 4 -->
      <path d="M 104 45 C 112 25 125 15 132 18 C 138 22 132 38 122 55" fill="#fed7aa" stroke="#ea580c" stroke-width="2" stroke-linecap="round" />
      <circle cx="135" cy="14" r="10" fill="#ef4444" />
      <text x="135" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">4</text>

      <!-- Missing 5th Finger Indicator -->
      <rect x="145" y="45" width="105" height="24" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" />
      <text x="197" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#dc2626">Missing 5th Digit</text>
    </g>

    <text x="200" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Observed: 3 Elongated Digits + 1 Thumb</text>
    <text x="200" y="215" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#64748b">Latency: 10.77s on Intel Arc A770M (16GB)</text>
    <text x="200" y="233" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">Status: Discarded by Vetting Studio</text>
  </g>

  <!-- Right Card: Systematic Mitigation -->
  <g transform="translate(450, 60)">
    <rect width="400" height="250" rx="12" fill="#FFFFFF" stroke="#10b981" stroke-width="2" filter="url(#flawShadow)" />
    
    <!-- Header -->
    <rect x="16" y="14" width="200" height="24" rx="12" fill="#ecfdf5" />
    <text x="116" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">SYSTEMATIC MITIGATION</text>

    <!-- Steps -->
    <g transform="translate(20, 50)">
      <!-- Step 1 -->
      <circle cx="14" cy="14" r="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="14" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">1</text>
      <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Lock Flat 2D Vector System Anchor</text>
      <text x="38" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#475569">Enforce clean outlines &amp; simplified anatomy</text>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="14" cy="14" r="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
        <text x="14" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">2</text>
        <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Gemini Flash Prompt Framing</text>
        <text x="38" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#475569">Instruct hands holding/touching concrete targets</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="14" cy="14" r="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
        <text x="14" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#065f46">3</text>
        <text x="38" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Local Web Review Studio</text>
        <text x="38" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#475569">One-key [F] hotkey flagging &amp; autonomous re-gen</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 144)">
        <rect width="360" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
        <text x="180" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d">Result: 498 Curated Montessori Cards Stabilised</text>
      </g>
    </g>
  </g>
</svg>
