<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="auto">
  <defs>
    <linearGradient id="foGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <filter id="foShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="foArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="foArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="960" height="460" rx="16" fill="url(#foGrad)" stroke="#e5ded4" stroke-width="1.5" />

  <!-- TIER 1: CONVENTIONAL SLOWPATH (UPPER) -->
  <g transform="translate(35, 25)">
    <rect width="890" height="185" rx="14" fill="#FFFFFF" stroke="#fca5a5" stroke-width="2" filter="url(#foShadow)" />
    
    <rect x="20" y="14" width="250" height="26" rx="13" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="145" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">CONVENTIONAL SLOWPATH (100% CPU)</text>

    <!-- Pipeline Steps -->
    <g transform="translate(20, 52)">
      <!-- Step 1: Ingress -->
      <rect x="0" y="0" width="105" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="52" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Ingress skb</text>

      <path d="M 108 30 L 128 30" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#foArrowRed)" />

      <!-- Step 2: PREROUTING -->
      <rect x="135" y="0" width="118" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
      <text x="194" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#991b1b">PREROUTING</text>
      <text x="194" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ef4444">Raw / Mangle</text>

      <path d="M 256 30 L 276 30" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#foArrowRed)" />

      <!-- Step 3: Conntrack -->
      <rect x="283" y="0" width="118" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
      <text x="342" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#991b1b">Conntrack</text>
      <text x="342" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ef4444">State Lookup</text>

      <path d="M 404 30 L 424 30" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#foArrowRed)" />

      <!-- Step 4: FIB Routing -->
      <rect x="431" y="0" width="118" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
      <text x="490" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#991b1b">FIB Lookup</text>
      <text x="490" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ef4444">Routing Dec.</text>

      <path d="M 552 30 L 572 30" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#foArrowRed)" />

      <!-- Step 5: FORWARD & SNAT -->
      <rect x="579" y="0" width="140" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" />
      <text x="649" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#991b1b">FORWARD</text>
      <text x="649" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ef4444">SNAT Masquerade</text>

      <path d="M 722 30 L 742 30" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#foArrowRed)" />

      <!-- Step 6: Egress -->
      <rect x="749" y="0" width="105" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="801" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Egress dev</text>
    </g>

    <!-- Warning banner -->
    <rect x="20" y="128" width="850" height="38" rx="8" fill="#fef2f2" stroke="#fecaca" />
    <text x="445" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">
      Bottleneck: Evaluated for every single 1500-byte frame • CPU hits 100% Software IRQ ceiling (~300 Mbps)
    </text>
  </g>

  <!-- TIER 2: FLOWTABLE FASTPATH (LOWER) -->
  <g transform="translate(35, 230)">
    <rect width="890" height="195" rx="14" fill="#FFFFFF" stroke="#86efac" stroke-width="2.5" filter="url(#foShadow)" />
    
    <rect x="20" y="14" width="250" height="26" rx="13" fill="#ecfdf5" stroke="#86efac" stroke-width="1" />
    <text x="145" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#047857">FLOWTABLE FASTPATH (&lt;20% CPU)</text>

    <!-- Pipeline Steps Fastpath -->
    <g transform="translate(20, 52)">
      <!-- Step 1: Ingress -->
      <rect x="0" y="0" width="140" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="70" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Ingress Frame</text>

      <path d="M 145 30 L 195 30" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#foArrowGreen)" />

      <!-- Step 2: Flowtable Lookup Cache -->
      <rect x="205" y="0" width="280" height="60" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="2" />
      <text x="345" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#047857">Flowtable Cache Lookup</text>
      <text x="345" y="47" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#065f46">Hash match: 5-tuple (L3/L4)</text>

      <!-- Fast Path Direct to Egress -->
      <path d="M 490 30 L 690 30" fill="none" stroke="#10b981" stroke-width="3.5" marker-end="url(#foArrowGreen)" />
      <text x="590" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#059669">FASTPATH BYPASS</text>

      <!-- Step 3: Direct Egress -->
      <rect x="700" y="0" width="150" height="60" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5" />
      <text x="775" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#047857">Direct Egress</text>
      <text x="775" y="47" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#065f46">L2/L3 Rewritten</text>
    </g>

    <!-- Outcome banner -->
    <rect x="20" y="132" width="850" height="38" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="445" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#047857">
      Outcome: 940 Mbps line-rate gigabit throughput • CPU load drops from 100% to &lt;20% idle headroom
    </text>
  </g>
</svg>
