<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto">
  <defs>
    <linearGradient id="foGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <filter id="foShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="foArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="foArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="960" height="440" rx="16" fill="url(#foGrad)" stroke="#e5ded4" stroke-width="1.5" />

  <!-- TIER 1: CONVENTIONAL SLOWPATH (UPPER) -->
  <g transform="translate(40, 30)">
    <rect width="880" height="175" rx="12" fill="#FFFFFF" stroke="#fca5a5" stroke-width="1.5" filter="url(#foShadow)" />
    
    <rect x="20" y="14" width="220" height="22" rx="11" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="130" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">CONVENTIONAL SLOWPATH (100% CPU)</text>

    <!-- Pipeline Steps -->
    <g transform="translate(20, 50)">
      <!-- Step 1: Ingress -->
      <rect x="0" y="0" width="105" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="52" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Ingress skb</text>

      <path d="M 108 27 L 128 27" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#foArrowRed)" />

      <!-- Step 2: PREROUTING -->
      <rect x="135" y="0" width="115" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="192" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">PREROUTING</text>
      <text x="192" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#ef4444">Raw / Mangle</text>

      <path d="M 253 27 L 273 27" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#foArrowRed)" />

      <!-- Step 3: Conntrack -->
      <rect x="280" y="0" width="115" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="337" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">Conntrack</text>
      <text x="337" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#ef4444">Full State Lookup</text>

      <path d="M 398 27 L 418 27" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#foArrowRed)" />

      <!-- Step 4: FIB Routing -->
      <rect x="425" y="0" width="115" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="482" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">FIB Lookup</text>
      <text x="482" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#ef4444">Routing Decision</text>

      <path d="M 543 27 L 563 27" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#foArrowRed)" />

      <!-- Step 5: FORWARD & POSTROUTING -->
      <rect x="570" y="0" width="135" height="55" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="637" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">FORWARD / SNAT</text>
      <text x="637" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#ef4444">NAT Masquerade</text>

      <path d="M 708 27 L 728 27" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#foArrowRed)" />

      <!-- Step 6: Egress -->
      <rect x="735" y="0" width="105" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="787" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Egress dev</text>
    </g>

    <!-- Warning banner -->
    <rect x="20" y="125" width="840" height="32" rx="6" fill="#fef2f2" stroke="#fecaca" />
    <text x="440" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">
      Bottleneck: Evaluated for EVERY 1500-byte frame • CPU hits 100% Software IRQ ceiling (~300 Mbps ceiling)
    </text>
  </g>

  <!-- TIER 2: FLOWTABLE FASTPATH (LOWER) -->
  <g transform="translate(40, 230)">
    <rect width="880" height="175" rx="12" fill="#FFFFFF" stroke="#86efac" stroke-width="2" filter="url(#foShadow)" />
    
    <rect x="20" y="14" width="220" height="22" rx="11" fill="#ecfdf5" stroke="#86efac" stroke-width="1" />
    <text x="130" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">FLOWTABLE FASTPATH (&lt;20% CPU)</text>

    <!-- Pipeline Steps Fastpath -->
    <g transform="translate(20, 50)">
      <!-- Step 1: Ingress -->
      <rect x="0" y="0" width="130" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="65" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Ingress Frame</text>

      <path d="M 135 27 L 180 27" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#foArrowGreen)" />

      <!-- Step 2: Flowtable Lookup Cache -->
      <rect x="190" y="0" width="260" height="55" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5" />
      <text x="320" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857">Flowtable Cache Lookup</text>
      <text x="320" y="42" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#065f46">Hash match: 5-tuple (L3/L4)</text>

      <!-- Fast Path Direct to Egress -->
      <path d="M 455 27 L 695 27" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#foArrowGreen)" />
      <text x="575" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">FASTPATH BYPASS</text>

      <!-- Step 3: Direct Egress -->
      <rect x="705" y="0" width="135" height="55" rx="8" fill="#ecfdf5" stroke="#86efac" />
      <text x="772" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">Direct Egress</text>
      <text x="772" y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#065f46">L2/L3 Rewritten</text>
    </g>

    <!-- Outcome banner -->
    <rect x="20" y="125" width="840" height="32" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="440" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">
      Outcome: 940 Mbps line-rate gigabit forwarding • CPU drops from 100% to &lt;20% idle headroom
    </text>
  </g>
</svg>
