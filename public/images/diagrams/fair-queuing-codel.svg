<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto">
  <defs>
    <linearGradient id="fqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <filter id="fqShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="fqArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="fqArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="fqArrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#fqGrad)" stroke="#e5ded4" stroke-width="1.5" />

  <!-- TIER 1: UNMANAGED FIFO QUEUE (UPPER) -->
  <g transform="translate(40, 30)">
    <rect width="880" height="165" rx="12" fill="#FFFFFF" stroke="#fca5a5" stroke-width="1.5" filter="url(#fqShadow)" />
    
    <rect x="20" y="14" width="220" height="22" rx="11" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="130" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">UNMANAGED FIFO (TAIL-DROP BUFFER)</text>

    <!-- Packets in Queue -->
    <g transform="translate(30, 50)">
      <!-- Bulk Packets -->
      <rect x="0" y="0" width="105" height="45" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="52" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Bulk Pkt 1</text>

      <rect x="115" y="0" width="105" height="45" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="167" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Bulk Pkt 2</text>

      <rect x="230" y="0" width="105" height="45" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="282" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Bulk Pkt 3</text>

      <rect x="345" y="0" width="105" height="45" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="397" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Bulk Pkt 4</text>

      <!-- Trapped DNS Packet -->
      <rect x="460" y="0" width="130" height="45" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
      <text x="525" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#b91c1c">DNS / VoIP</text>
      <text x="525" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ef4444">Trapped in Queue</text>

      <!-- Arrow Red to Egress -->
      <path d="M 605 22 L 675 22" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#fqArrowRed)" />

      <!-- High latency result box -->
      <rect x="685" y="0" width="135" height="45" rx="6" fill="#fee2e2" stroke="#fca5a5" />
      <text x="752" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#991b1b">RTT: 300ms+</text>
      <text x="752" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#b91c1c">Severe Lag</text>
    </g>

    <!-- Subtitle -->
    <rect x="30" y="115" width="820" height="28" rx="6" fill="#fef2f2" />
    <text x="440" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">
      Failure Mode: Single FIFO buffer saturated by bulk transfers; latency-sensitive packets forced to wait behind MBs of data.
    </text>
  </g>

  <!-- TIER 2: SMART QUEUE MANAGEMENT (LOWER) -->
  <g transform="translate(40, 220)">
    <rect width="880" height="170" rx="12" fill="#FFFFFF" stroke="#86efac" stroke-width="2" filter="url(#fqShadow)" />
    
    <rect x="20" y="14" width="260" height="22" rx="11" fill="#ecfdf5" stroke="#86efac" stroke-width="1" />
    <text x="150" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">SMART QUEUE MANAGEMENT (CAKE / FQ-CODEL)</text>

    <!-- Sub-flows -->
    <g transform="translate(30, 48)">
      <!-- Flow 1: Sparse Flow (DNS/Gaming) -->
      <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Flow A (Sparse):</text>
      <rect x="130" y="2" width="140" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      <text x="200" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">DNS / ACK / VoIP</text>
      
      <path d="M 280 18 L 470 18" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#fqArrowGreen)" />
      <text x="375" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">ZERO QUEUE WAIT</text>

      <rect x="480" y="2" width="120" height="32" rx="6" fill="#d1fae5" stroke="#6ee7b7" />
      <text x="540" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">RTT: &lt; 5ms</text>

      <!-- Flow 2: Bulk Flow (Download/Sync) -->
      <text x="0" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Flow B (Bulk):</text>
      <rect x="130" y="46" width="90" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="175" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Bulk Pkt</text>
      <rect x="230" y="46" width="90" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
      <text x="275" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Bulk Pkt</text>

      <path d="M 330 62 L 470 62" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#fqArrowAmber)" />
      <text x="400" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">AQM PACING</text>

      <rect x="480" y="46" width="120" height="32" rx="6" fill="#fef3c7" stroke="#fcd34d" />
      <text x="540" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">Paced Flow</text>
    </g>

    <!-- Outcome banner -->
    <rect x="30" y="125" width="820" height="28" rx="6" fill="#ecfdf5" />
    <text x="440" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">
      Outcome: Independent DRR hash buckets isolate latency-sensitive packets; CoDel monitors dwell time and prevents bufferbloat.
    </text>
  </g>
</svg>
