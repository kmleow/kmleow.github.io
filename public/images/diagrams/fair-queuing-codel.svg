<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="auto">
  <defs>
    <linearGradient id="fqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <filter id="fqShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="fqArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="fqArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="fqArrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="960" height="450" rx="16" fill="url(#fqGrad)" stroke="#e5ded4" stroke-width="1.5" />

  <!-- TIER 1: UNMANAGED FIFO QUEUE (UPPER) -->
  <g transform="translate(35, 25)">
    <rect width="890" height="180" rx="14" fill="#FFFFFF" stroke="#fca5a5" stroke-width="2" filter="url(#fqShadow)" />
    
    <rect x="20" y="14" width="250" height="26" rx="13" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="145" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">UNMANAGED FIFO (TAIL-DROP BUFFER)</text>

    <!-- Packets in Queue -->
    <g transform="translate(25, 52)">
      <!-- Bulk Packets -->
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <text x="55" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569">Bulk Pkt 1</text>

      <rect x="120" y="0" width="110" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <text x="175" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569">Bulk Pkt 2</text>

      <rect x="240" y="0" width="110" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <text x="295" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569">Bulk Pkt 3</text>

      <rect x="360" y="0" width="110" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <text x="415" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569">Bulk Pkt 4</text>

      <!-- Trapped DNS Packet -->
      <rect x="480" y="0" width="145" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5" />
      <text x="552" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#b91c1c">DNS / VoIP</text>
      <text x="552" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ef4444">Trapped Behind Bulk</text>

      <!-- Arrow Red to Egress -->
      <path d="M 635 25 L 695 25" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#fqArrowRed)" />

      <!-- High latency result box -->
      <rect x="705" y="0" width="140" height="50" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" />
      <text x="775" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#991b1b">RTT: 300ms+</text>
      <text x="775" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Severe Lag Spike</text>
    </g>

    <!-- Subtitle -->
    <rect x="25" y="122" width="840" height="34" rx="8" fill="#fef2f2" />
    <text x="445" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">
      Failure Mode: Single FIFO buffer inundated by bulk transfers; latency-sensitive packets forced to wait behind MBs of data.
    </text>
  </g>

  <!-- TIER 2: SMART QUEUE MANAGEMENT (LOWER) -->
  <g transform="translate(35, 230)">
    <rect width="890" height="190" rx="14" fill="#FFFFFF" stroke="#86efac" stroke-width="2.5" filter="url(#fqShadow)" />
    
    <rect x="20" y="14" width="280" height="26" rx="13" fill="#ecfdf5" stroke="#86efac" stroke-width="1" />
    <text x="160" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#047857">SMART QUEUE MANAGEMENT (CAKE / FQ-CODEL)</text>

    <!-- Sub-flows -->
    <g transform="translate(25, 52)">
      <!-- Flow 1: Sparse Flow (DNS/Gaming) -->
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Flow A (Sparse):</text>
      <rect x="140" y="2" width="160" height="36" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
      <text x="220" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857">DNS / ACK / VoIP</text>
      
      <path d="M 310 20 L 490 20" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#fqArrowGreen)" />
      <text x="400" y="14" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#047857">ZERO WAIT (BYPASS)</text>

      <rect x="500" y="2" width="135" height="36" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5" />
      <text x="567" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#065f46">RTT: &lt; 5ms</text>

      <!-- Flow 2: Bulk Flow (Download/Sync) -->
      <text x="0" y="74" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Flow B (Bulk):</text>
      <rect x="140" y="52" width="100" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <text x="190" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">Bulk Pkt</text>
      <rect x="250" y="52" width="100" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <text x="300" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">Bulk Pkt</text>

      <path d="M 360 70 L 490 70" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#fqArrowAmber)" />
      <text x="425" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#b45309">AQM PACING</text>

      <rect x="500" y="52" width="135" height="36" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5" />
      <text x="567" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#92400e">Paced Flow</text>
    </g>

    <!-- Outcome banner -->
    <rect x="25" y="132" width="840" height="34" rx="8" fill="#ecfdf5" />
    <text x="445" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857">
      Outcome: Independent DRR hash buckets isolate latency-sensitive packets; CoDel monitors dwell time and prevents bufferbloat.
    </text>
  </g>
</svg>
