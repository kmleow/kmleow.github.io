<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="auto">
  <defs>
    <linearGradient id="ztGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <filter id="ztShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="zArrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="zArrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="960" height="450" rx="16" fill="url(#ztGrad)" stroke="#e5ded4" stroke-width="1.5" />

  <!-- ATTACK VECTOR FLOW (TOP) -->
  <g transform="translate(35, 30)">
    <!-- Attacker Node -->
    <rect width="230" height="135" rx="12" fill="#FFFFFF" stroke="#fca5a5" stroke-width="2" filter="url(#ztShadow)" />
    <rect x="18" y="14" width="95" height="24" rx="12" fill="#fee2e2" />
    <text x="65" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">THREAT</text>
    <text x="18" y="65" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#991b1b">Direct Scanner</text>
    <text x="18" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">• Shodan / Censys / Botnets</text>
    <text x="18" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">• Probes raw IP on port 443</text>

    <!-- Path Red to Firewall -->
    <path d="M 235 68 L 475 68" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#zArrowRed)" />
    <text x="355" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#dc2626">Direct IP Bypass Attempt</text>
  </g>

  <!-- LEGITIMATE FLOW (BOTTOM) -->
  <g transform="translate(35, 205)">
    <!-- User Node -->
    <rect width="190" height="175" rx="12" fill="#FFFFFF" stroke="#cbd5e1" stroke-width="2" filter="url(#ztShadow)" />
    <rect x="18" y="16" width="95" height="24" rx="12" fill="#f1f5f9" />
    <text x="65" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#475569">CLIENT</text>
    <text x="18" y="68" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#0f172a">Public User</text>
    <text x="18" y="94" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">• Resolves DNS</text>
    <text x="18" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">• HTTPS to Anycast</text>
    <text x="18" y="142" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">Legitimate traffic</text>

    <!-- Arrow User -> CDN -->
    <path d="M 195 95 L 235 95" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#zArrowGreen)" />

    <!-- CDN Edge Node -->
    <g transform="translate(245, 0)">
      <rect width="215" height="175" rx="12" fill="#FFFFFF" stroke="#f59e0b" stroke-width="2.5" filter="url(#ztShadow)" />
      <rect x="18" y="16" width="125" height="24" rx="12" fill="#fef3c7" />
      <text x="80" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#b45309">EDGE SECURITY</text>
      <text x="18" y="68" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#0f172a">CDN / WAF Edge</text>
      <text x="18" y="94" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">• DDoS Mitigation</text>
      <text x="18" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">• WAF Rule Engine</text>
      <text x="18" y="142" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#b45309">• Injects Client Cert</text>
    </g>

    <!-- Arrow CDN -> Origin -->
    <path d="M 465 95 L 505 95" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#zArrowGreen)" />
  </g>

  <!-- HARDENED ORIGIN HOST CONTAINER -->
  <g transform="translate(515, 30)">
    <rect width="410" height="385" rx="14" fill="#FFFFFF" stroke="#0f172a" stroke-width="2.5" filter="url(#ztShadow)" />
    <rect x="22" y="16" width="195" height="26" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <text x="119" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#0f172a">HARDENED ORIGIN SERVER</text>

    <!-- Firewall Sub-node (Layer 3/4) -->
    <g transform="translate(22, 55)">
      <rect width="365" height="120" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" />
      <text x="18" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#991b1b">Layer 3/4: Netfilter Ingress Filter</text>
      <text x="18" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Direct Attacker: DROPPED AT KERNEL</text>
      <text x="18" y="74" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#475569">Matches verified CDN IPv4/IPv6 CIDRs only</text>
      <text x="18" y="96" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">Socket connection refused to untrusted CIDRs</text>
    </g>

    <!-- Internal Arrow inside Origin -->
    <path d="M 205 180 L 205 205" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#zArrowGreen)" />

    <!-- Web Server Sub-node (Layer 7) -->
    <g transform="translate(22, 215)">
      <rect width="365" height="145" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
      <text x="18" y="28" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#166534">Layer 7: Mutual TLS (mTLS) Auth</text>
      <text x="18" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">Authenticated Origin Pulls Enforced</text>
      <text x="18" y="76" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#334155">• Requires valid Cloudflare Client Certificate</text>
      <text x="18" y="98" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#334155">• Handshake fails closed without trusted cert</text>
      <text x="18" y="124" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#047857">Outcome: Complete origin cloaking</text>
    </g>
  </g>
</svg>
