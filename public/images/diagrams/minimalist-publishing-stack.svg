<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="auto">
  <defs>
    <linearGradient id="msGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
    <filter id="msShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="msArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#msGrad)" stroke="#e5ded4" stroke-width="1.5" />

  <!-- Root Core Node: kmleow.com -->
  <g transform="translate(180, 25)">
    <rect width="540" height="85" rx="14" fill="#FFFFFF" stroke="#0f172a" stroke-width="2.5" filter="url(#msShadow)" />
    <circle cx="36" cy="42" r="10" fill="#10b981" />
    <text x="62" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f172a">www.leowkahman.com</text>
    <text x="62" y="62" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#475569">Astro 5 Static Architecture • Tailwind CSS • Zero Client Runtime Bloat</text>
  </g>

  <!-- Connectors from Root to Pillars -->
  <path d="M 310 110 L 310 145 L 210 145 L 210 165" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#msArrow)" />
  <path d="M 590 110 L 590 145 L 690 145 L 690 165" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#msArrow)" />

  <!-- Pillar 1: Clean Architecture -->
  <g transform="translate(30, 170)">
    <rect width="400" height="105" rx="14" fill="#FFFFFF" stroke="#cbd5e1" stroke-width="2" filter="url(#msShadow)" />
    <text x="24" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Disciplined Architecture</text>
    <text x="24" y="64" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• Zero third-party trackers &amp; bloated scripts</text>
    <text x="24" y="88" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• Semantic HTML, fast load &amp; JSON-LD schemas</text>
  </g>

  <!-- Pillar 2: Professional Channel -->
  <g transform="translate(470, 170)">
    <rect width="400" height="105" rx="14" fill="#FFFFFF" stroke="#cbd5e1" stroke-width="2" filter="url(#msShadow)" />
    <text x="24" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">LinkedIn Engagement Channel</text>
    <text x="24" y="64" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• No spammy on-site comment widgets (Disqus purged)</text>
    <text x="24" y="88" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">• Peer discussions with fellow directors &amp; architects</text>
  </g>
</svg>
